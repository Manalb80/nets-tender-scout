# Render.com deployment config
# This file tells Render how to build and run the app
services:
  - type: web
    name: nets-tender-scout
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install chromium && playwright install-deps chromium
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false  # you set this in Render dashboard
      - key: DATABASE_URL
        sync: false  # paste your Supabase connection string
      - key: SCAN_HOUR
        value: "5"
      - key: SCAN_MINUTE
        value: "47"
      - key: PYTHON_VERSION
        value: "3.12.0"
