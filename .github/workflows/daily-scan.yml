name: Daily Tender Scan

on:
  schedule:
    - cron: '47 5 * * 1-6'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 sqlalchemy psycopg2-binary psycopg

      - name: Run tender scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/github_scan.py
