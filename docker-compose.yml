version: "3.9"

services:
  tender-scout:
    build: .
    container_name: nets-tender-scout
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # persist database across restarts
    environment:
      - DATABASE_URL=sqlite:////app/data/tender_scout.db
      - SCAN_HOUR=5               # scrape at 05:47 UK time
      - SCAN_MINUTE=47
    restart: unless-stopped

