/* Download helpers */
var DL=null;
(async function(){try{DL=await claude.use("downloads")}catch(e){DL=null}})();

function triggerDownload(filename, blob){
  if(DL){
    try{DL.save({filename:filename,data:blob});return}catch(e){}
  }
  /* Fallback: standard browser download */
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function downloadProposalDocx(id){
  var p=PROPOSALS.find(function(x){return x._id===id});
  if(!p)return;

  var D=window.docx;
  if(!D){alert("DOCX library not loaded. Please refresh the page.");return}

  /* Parse markdown-ish proposal text into docx paragraphs */
  var lines=p.proposal_text.split("\n");
  var children=[];

  /* Title page */
  children.push(new D.Paragraph({spacing:{after:600},children:[]}));
  children.push(new D.Paragraph({
    alignment:D.AlignmentType.CENTER,spacing:{after:200},
    children:[new D.TextRun({text:"NETS International",font:"Arial",size:36,bold:true,color:"16a34a"})]
  }));
  children.push(new D.Paragraph({
    alignment:D.AlignmentType.CENTER,spacing:{after:100},
    children:[new D.TextRun({text:"Technical Proposal",font:"Arial",size:28,bold:true})]
  }));
  children.push(new D.Paragraph({
    alignment:D.AlignmentType.CENTER,spacing:{after:80},
    children:[new D.TextRun({text:p.rfp_title,font:"Arial",size:24,color:"333333"})]
  }));
  children.push(new D.Paragraph({
    alignment:D.AlignmentType.CENTER,spacing:{after:40},
    children:[new D.TextRun({text:"RFP Reference: "+p._id,font:"Arial",size:20,color:"666666"})]
  }));
  children.push(new D.Paragraph({
    alignment:D.AlignmentType.CENTER,spacing:{after:40},
    children:[new D.TextRun({text:"Client: "+(p.client||"Sindh Bank"),font:"Arial",size:20,color:"666666"})]
  }));
  children.push(new D.Paragraph({
    alignment:D.AlignmentType.CENTER,spacing:{after:40},
    children:[new D.TextRun({text:"Solutions: "+(p.solutions||[]).join(", "),font:"Arial",size:20,color:"666666"})]
  }));
  children.push(new D.Paragraph({
    alignment:D.AlignmentType.CENTER,spacing:{after:200},
    children:[new D.TextRun({text:"Generated: "+(p.generated_at||"").substring(0,10)+" | Audit Score: "+p.audit_score+"/100 ("+p.audit_verdict+")",font:"Arial",size:18,color:"999999"})]
  }));
  children.push(new D.Paragraph({children:[new D.PageBreak()]}));

  /* Body: convert markdown headings and paragraphs */
  lines.forEach(function(line){
    var trimmed=line.trim();
    if(!trimmed)return;

    /* Heading levels */
    var h1=trimmed.match(/^#\s+(.+)/);
    var h2=trimmed.match(/^##\s+(.+)/);
    var h3=trimmed.match(/^###\s+(.+)/);
    var numbered=trimmed.match(/^(\d+)\.\s+(.+)/);
    var bullet=trimmed.match(/^[-*]\s+(.+)/);

    if(h1){
      children.push(new D.Paragraph({
        heading:D.HeadingLevel.HEADING_1,spacing:{before:360,after:120},keepNext:true,
        children:[new D.TextRun({text:h1[1],font:"Arial",size:28,bold:true,color:"1a1a1a"})]
      }));
    } else if(h2){
      children.push(new D.Paragraph({
        heading:D.HeadingLevel.HEADING_2,spacing:{before:280,after:100},keepNext:true,
        children:[new D.TextRun({text:h2[1],font:"Arial",size:24,bold:true,color:"333333"})]
      }));
    } else if(h3||numbered){
      var txt=h3?h3[1]:(numbered[1]+". "+numbered[2]);
      children.push(new D.Paragraph({
        heading:D.HeadingLevel.HEADING_3,spacing:{before:200,after:80},keepNext:true,
        children:[new D.TextRun({text:txt,font:"Arial",size:22,bold:true,color:"444444"})]
      }));
    } else if(bullet){
      children.push(new D.Paragraph({
        spacing:{after:60},indent:{left:720},
        children:[
          new D.TextRun({text:"•  ",font:"Arial",size:20}),
          new D.TextRun({text:bullet[1],font:"Arial",size:20,color:"333333"})
        ]
      }));
    } else {
      /* Regular paragraph; handle **bold** */
      var runs=[];
      var parts=trimmed.split(/\*\*(.+?)\*\*/g);
      for(var i=0;i<parts.length;i++){
        if(!parts[i])continue;
        runs.push(new D.TextRun({text:parts[i],font:"Arial",size:20,bold:i%2===1,color:"333333"}));
      }
      if(runs.length){
        children.push(new D.Paragraph({spacing:{after:80},children:runs}));
      }
    }
  });

  /* Footer with confidentiality */
  children.push(new D.Paragraph({spacing:{before:400},children:[]}));
  children.push(new D.Paragraph({
    border:{top:{style:D.BorderStyle.SINGLE,size:1,color:"cccccc",space:8}},
    spacing:{before:200},
    children:[new D.TextRun({text:"CONFIDENTIAL: This document is the property of NETS International and is intended solely for the addressee. Unauthorised distribution is prohibited.",font:"Arial",size:16,italics:true,color:"999999"})]
  }));

  var doc=new D.Document({
    styles:{

/* ===== Dynamic RFP Requirements Extraction ===== */
/* For a layman: this reads what the tender asked for and checks if our proposal covers it.
   For a developer: it builds the requirement matrix from tender keywords, solution matches,
   Agent 4 verified/missing arrays, and Agent 5 regulatory fields. */
function extractRequirements(tender, proposal){
  var reqs=[];

  /* 1. From tender's matched NETS solutions: these are the capabilities the RFP needs */
  if(tender&&tender.solMatch){
    tender.solMatch.forEach(function(s){
      reqs.push({
        category:"Technical Capability",
        requirement:s.name+(s.group?" ("+s.group+")":""),
        source:"RFP keyword match",
        inProposal:!!proposal,
        detail:proposal?"Addressed in proposal ("+s.name+" section)":"Proposal not yet written",
        gap:proposal?"None":"Pending proposal"
      });
    });
  }

  /* 2. From tender's matched keywords: specific technical terms the RFP mentions */
  if(tender&&tender.matched){
    tender.matched.forEach(function(kw){
      /* Skip if already covered by a solution match */
      if(reqs.some(function(r){return r.requirement.toLowerCase().indexOf(kw.toLowerCase())>=0}))return;
      var inProp=proposal&&proposal.proposal_text&&proposal.proposal_text.toLowerCase().indexOf(kw.toLowerCase())>=0;
      reqs.push({
        category:"RFP Keyword",
        requirement:kw.charAt(0).toUpperCase()+kw.slice(1),
        source:"Found in tender title",
        inProposal:inProp,
        detail:inProp?"Keyword appears in proposal text":"Not found in proposal text",
        gap:inProp?"None":"May need explicit mention"
      });
    });
  }

  /* 3. From Agent 4 audit: verified and missing requirements */
  if(proposal&&proposal.verified_requirements){
    proposal.verified_requirements.forEach(function(r){
      if(!reqs.some(function(x){return x.requirement===r})){
        reqs.push({category:"Agent 4 Verified",requirement:r,source:"Technical audit",inProposal:true,detail:"Verified by Agent 4",gap:"None"});
      }
    });
  }
  if(proposal&&proposal.missing_requirements){
    proposal.missing_requirements.forEach(function(r){
      reqs.push({category:"Agent 4 Gap",requirement:r,source:"Technical audit",inProposal:false,detail:"Missing from proposal",gap:r});
    });
  }

  /* 4. Standard compliance requirements (always required for Pakistan public sector) */
  var stdReqs=[
    {req:"ISO 27001 Certification",check:function(p){return p&&p.proposal_text&&/iso.?27001/i.test(p.proposal_text)}},
    {req:"24/7 Local Support SLA",check:function(p){return p&&p.proposal_text&&/24.?7/i.test(p.proposal_text)}},
    {req:"Uptime SLA (99.9%+)",check:function(p){return p&&p.proposal_text&&/99\.\d+%/i.test(p.proposal_text)}},
    {req:"PPRA Open Bidding Compliance",check:function(p){return p&&(p.regulatory_score>=80||false)}},
    {req:"Data Sovereignty (Pakistan)",check:function(p){return p&&p.data_sovereignty_verified===true}},
    {req:"SBP Circular 02/2019",check:function(p){return p&&p.proposal_text&&/sbp/i.test(p.proposal_text)}},
    {req:"SECP Companies Act 2017",check:function(p){return p&&p.proposal_text&&/secp|companies act/i.test(p.proposal_text)}},
    {req:"Escalation Matrix",check:function(p){return p&&p.proposal_text&&/escalat/i.test(p.proposal_text)}}
  ];
  stdReqs.forEach(function(sr){
    if(reqs.some(function(r){return r.requirement.toLowerCase().indexOf(sr.req.toLowerCase().substring(0,10))>=0}))return;
    var met=sr.check(proposal);
    reqs.push({
      category:"Standard Compliance",
      requirement:sr.req,
      source:"Pakistan public sector requirement",
      inProposal:met,
      detail:met?"Found in proposal":"Not addressed",
      gap:met?"None":"Must be added before submission"
    });
  });

  return reqs;
}

function renderRequirementsTable(reqs){
  var met=reqs.filter(function(r){return r.inProposal}).length;
  var total=reqs.length;
  var pct=total?Math.round(met/total*100):0;
  var barColor=pct>=90?"var(--green)":pct>=60?"var(--amber)":"var(--red)";

  var html='<div style="display:flex;align-items:center;gap:16px;margin-bottom:14px">';
  html+='<div style="font-size:13px;color:var(--fg-muted)">'+met+' of '+total+' requirements covered</div>';
  html+='<div style="flex:1;max-width:200px;height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:'+barColor+';border-radius:3px"></div></div>';
  html+='<div style="font-size:13px;font-weight:700;color:'+barColor+'">'+pct+'%</div>';
  html+='</div>';

  html+='<div class="tbl-wrap"><table><thead><tr><th style="width:30px"></th><th>Requirement</th><th>Category</th><th>In Proposal?</th><th>Gap</th></tr></thead><tbody>';
  reqs.forEach(function(r){
    html+='<tr>'
      +'<td style="text-align:center;font-size:14px">'+(r.inProposal?'✅':'⬜')+'</td>'
      +'<td><strong style="font-size:12px">'+r.requirement+'</strong><br><span style="font-size:10px;color:var(--fg-faint)">'+r.source+'</span></td>'
      +'<td><span class="badge '+(r.category.indexOf("Gap")>=0?"b-r":r.category==="Standard Compliance"?"b-a":"b-g")+'" style="font-size:9px">'+r.category+'</span></td>'
      +'<td style="font-size:11px;color:'+(r.inProposal?"var(--green)":"var(--red)")+'">'+r.detail+'</td>'
      +'<td style="font-size:11px;color:'+(r.gap==="None"?"var(--green)":"var(--red)")+';font-weight:'+(r.gap==="None"?"400":"600")+'">'+r.gap+'</td>'
      +'</tr>';
  });
  html+='</tbody></table></div>';
  return html;
}

function scSelect(key,label,opts){
  return'<select onchange="SC_FILTER.'+key+'=this.value;render()" style="font-size:11px;padding:5px 8px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-family:inherit">'
    +opts.map(function(o){var p=o.split(":");return'<option value="'+p[0]+'"'+(SC_FILTER[key]===p[0]?' selected':'')+'>'+p[1]+'</option>'}).join('')
    +'</select>';
}

function formatNum(n){
  if(n>=1000000)return(n/1000000).toFixed(1)+"M";
  if(n>=1000)return(n/1000).toFixed(0)+"K";
  return n.toString();
}

function scAssign(id,engineer){
  var t=T.find(function(x){return x.id===id});
  if(t&&t._sc){
    t._sc.assignee=engineer;
    if(DB){
      DB.doc("tenders/"+id).update({assignee:engineer,assigned_at:new Date().toISOString()}).catch(function(e){console.error(e)});
    }
  }
  render();
}

function scGoNogo(id,verdict){
  var t=T.find(function(x){return x.id===id});
  if(t&&t._sc){
    t._sc.goNogo=verdict;
    if(DB){
      DB.doc("tenders/"+id).update({goNogo:verdict}).catch(function(e){console.error(e)});
    }
  }
  render();
}

function scReminder(id){
  var t=T.find(function(x){return x.id===id});
  if(!t||!t._sc)return;
  if(t._sc.assignee==="Unassigned"){
    alert("Assign an engineer first before sending a reminder.");
    return;
  }
  t._sc.reminderSent=true;
  if(DB){
    DB.doc("tenders/"+id).update({
      reminder_sent:true,
      reminder_to:t._sc.assignee,
      reminder_at:new Date().toISOString(),
      reminder_deadline:t.cl
    }).catch(function(e){console.error(e)});
  }
  alert("Deadline reminder dispatched to "+t._sc.assignee+" for tender "+t.id+" (closing "+t.cl+").");
  render();
}

function exportSalesCSV(){
  var bids=T.filter(function(t){return t.score>=70&&t.open&&t._sc});
  var rows=["Tender ID,Title,Portal,Sector,Est Value (PKR),Win Prob %,Deadline,Days Left,Assigned To,Go/No-Go"];
  bids.forEach(function(t){
    var sc=t._sc;
    rows.push([t.id,'"'+t.ti.replace(/"/g,'""')+'"',t.source||"Sindh Bank",sc.sector,sc.estValue,sc.winProb,t.cl||"",t.days!==null?t.days:"",sc.assignee,sc.goNogo].join(","));
  });
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="NETS_Pipeline_"+new Date().toISOString().substring(0,10)+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

var SD_TEAM=[
  {name:"Arsalan Naveed",initials:"AN",color:"#3987e5",capacity:0},
  {name:"Sharjeel Amar Ilahi",initials:"SA",color:"#d95926",capacity:0},
  {name:"Jahangir Khan",initials:"JK",color:"#199e70",capacity:0},
  {name:"Bilal Saleem",initials:"BS",color:"#c98500",capacity:0},
  {name:"Ikram Ahmed",initials:"IA",color:"#d55181",capacity:0},
  {name:"Faheem Malik",initials:"FM",color:"#008300",capacity:0},
  {name:"Unassigned",initials:"--",color:"#666",capacity:0}
];
var SD_COMPETITORS=[
  {name:"Huawei",count:0},{name:"Cisco",count:0},{name:"Dell",count:0},
  {name:"Fortinet",count:0},{name:"Palo Alto",count:0},{name:"HPE",count:0}
];
var SD_FILTER={sector:"",region:"",value:"",deadline:"",stage:"",sort:"deadline"};
var SD_VIEW="all";

function vSalesDash(){
  var bids=T.filter(function(t){return t.score>=70&&t.open});
  bids.forEach(function(t){
    if(!t._sd){
      t._sd={
        estValue:Math.round((t.score/100)*800000+(t.solMatch.length*150000)),
        winProb:t.score>=95?65:t.score>=85?55:t.score>=75?45:35,
        assignee:t.assignee||"Unassigned",
        goNogo:t.goNogo||"pending",
        sector:t.solMatch.length?t.solMatch[0].group:"Other",
        region:"Pakistan",
        repeat:false,
        competitors:[]
      };
      /* Detect competitors from solution matches */
      t.solMatch.forEach(function(s){
        if(s.name.toLowerCase().indexOf("cyber")>=0||s.name.toLowerCase().indexOf("security")>=0)t._sd.competitors.push("Fortinet");
        if(s.name.toLowerCase().indexOf("network")>=0)t._sd.competitors.push("Cisco");
        if(s.name.toLowerCase().indexOf("data centre")>=0||s.name.toLowerCase().indexOf("server")>=0)t._sd.competitors.push("Dell");
      });
    }
  });

  /* Apply filters */
  var filtered=bids.filter(function(t){
    var sd=t._sd;
    if(SD_FILTER.sector&&sd.sector!==SD_FILTER.sector)return false;
    if(SD_FILTER.deadline){var dl=parseInt(SD_FILTER.deadline);if(t.days===null||t.days>dl)return false}
    if(SD_FILTER.value==="small"&&sd.estValue>=500000)return false;
    if(SD_FILTER.value==="medium"&&(sd.estValue<500000||sd.estValue>=2000000))return false;
    if(SD_FILTER.value==="large"&&(sd.estValue<2000000||sd.estValue>=10000000))return false;
    if(SD_FILTER.stage&&sd.goNogo!==SD_FILTER.stage)return false;
    return true;
  });

  /* Sort */
  if(SD_FILTER.sort==="value")filtered.sort(function(a,b){return b._sd.estValue-a._sd.estValue});
  else if(SD_FILTER.sort==="winProb")filtered.sort(function(a,b){return b._sd.winProb-a._sd.winProb});
  else filtered.sort(function(a,b){return(a.days||999)-(b.days||999)});

  /* Metrics */
  var pipeline=0,forecast=0,urgent=0;
  filtered.forEach(function(t){pipeline+=t._sd.estValue;forecast+=Math.round(t._sd.estValue*(t._sd.winProb/100));if(t.days!==null&&t.days<=7)urgent++});
  var avgWin=filtered.length?Math.round(filtered.reduce(function(s,t){return s+t._sd.winProb},0)/filtered.length):0;

  /* Compute workload */
  SD_TEAM.forEach(function(m){m.bids=0;m.capacity=0;m.value=0});
  bids.forEach(function(t){
    var m=SD_TEAM.find(function(x){return x.name===t._sd.assignee})||SD_TEAM[SD_TEAM.length-1];
    m.bids++;m.value+=t._sd.estValue;
    m.capacity=Math.min(100,m.bids*20);
  });

  /* Compute competitor sightings */
  var compMap={};
  bids.forEach(function(t){(t._sd.competitors||[]).forEach(function(c){compMap[c]=(compMap[c]||0)+1})});
  SD_COMPETITORS.forEach(function(c){c.count=compMap[c.name]||0});
  SD_COMPETITORS.sort(function(a,b){return b.count-a.count});

  var fmt=function(n){if(n>=1e6)return"PKR "+(n/1e6).toFixed(1)+"M";if(n>=1e3)return"PKR "+(n/1e3).toFixed(0)+"K";return"PKR "+n};

  var html='<style>.sd *{box-sizing:border-box}.sd .sd-stat{font-family:"Space Grotesk",system-ui,sans-serif}.sd .sd-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;transition:border-color .15s}.sd .sd-card:hover{border-color:var(--green)}.sd select{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;font-family:inherit}.sd .sd-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}.sd .urg-crit{background:rgba(220,59,59,.15);color:#d03b3b}.sd .urg-ser{background:rgba(236,131,90,.15);color:#ec835a}.sd .urg-warn{background:rgba(250,178,25,.15);color:#fab219}.sd .urg-ok{background:rgba(12,163,12,.15);color:#0ca30c}.sd .go-go{background:rgba(12,163,12,.15);color:#0ca30c;cursor:pointer}.sd .go-nogo{background:rgba(220,59,59,.15);color:#d03b3b;cursor:pointer}.sd .go-pend{background:rgba(250,178,25,.15);color:#fab219;cursor:pointer}.sd table{width:100%;border-collapse:collapse;font-size:13px}.sd th{text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-faint);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}.sd td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}.sd tr:hover td{background:rgba(76,175,80,.04)}.sd .bar-chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:10px}.sd .bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}.sd .bar{width:100%;border-radius:4px 4px 0 0;min-height:2px}.sd .wl-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}.sd .wl-row:last-child{border:none}.sd .wl-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}.sd .comp-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}.sd .comp-row:last-child{border:none}</style>';

  html+='<div class="sd">';

  /* Header */
  html+='<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:16px">'
    +'<div style="display:flex;align-items:center;gap:12px"><div style="width:36px;height:36px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff">N</div>'
    +'<div><div style="font-size:20px;font-weight:700;letter-spacing:-.02em" class="sd-stat">NETS AI Sales Command</div><div style="font-size:12px;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.08em">Presales & Bid Intelligence · Sales Head View</div></div></div>'
    +'<div style="display:flex;gap:8px">'
    +'<div style="display:inline-flex;border-radius:8px;overflow:hidden;border:1px solid var(--border)">'
    +'<button onclick="SD_VIEW=\'my\';render()" style="padding:6px 14px;border:none;font-size:13px;cursor:pointer;font-family:inherit;'+(SD_VIEW==="my"?"background:var(--green);color:#fff;font-weight:600":"background:transparent;color:var(--fg-muted)")+'">My Tenders</button>'
    +'<button onclick="SD_VIEW=\'all\';render()" style="padding:6px 14px;border:none;font-size:13px;cursor:pointer;font-family:inherit;'+(SD_VIEW==="all"?"background:var(--green);color:#fff;font-weight:600":"background:transparent;color:var(--fg-muted)")+'">All Team</button></div>'
    +'<button onclick="exportSalesCSV()" style="padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;cursor:pointer;font-family:inherit">Export CSV</button>'
    +'<button onclick="exportSalesJSON()" style="padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;cursor:pointer;font-family:inherit">Export JSON</button>'
    +'</div></div>';

  /* Filters */
  html+='<div style="display:flex;gap:10px;padding:14px 0;flex-wrap:wrap;align-items:flex-end">';
  var sdSel=function(key,label,opts){
    return'<div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-faint);font-weight:600">'+label+'</span>'
      +'<select onchange="SD_FILTER.'+key+'=this.value;render()">'
      +opts.map(function(o){var p=o.split(":");return'<option value="'+p[0]+'"'+(SD_FILTER[key]===p[0]?' selected':'')+'>'+p[1]+'</option>'}).join('')
      +'</select></div>';
  };
  html+=sdSel("sector","Sector",["::All Sectors","Infrastructure:Infrastructure","Digital:Digital","Managed IT:Managed IT"]);
  html+=sdSel("deadline","Deadline",["::Any Deadline","7:Within 7 days","14:Within 14 days","30:Within 30 days"]);
  html+=sdSel("value","Value Band",["::All Values","small:<500K","medium:500K-2M","large:2M+"]);
  html+=sdSel("stage","Go/No-Go",["::All Status","go:Go","nogo:No-Go","pending:Pending"]);
  html+=sdSel("sort","Sort By",["deadline:Deadline (Urgent first)","value:Value (High to Low)","winProb:Win Probability"]);
  html+='</div>';

  /* Stat tiles */
  html+='<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px">';
  var stats=[
    {val:fmt(pipeline),label:"Pipeline Value",delta:filtered.length+" bids",color:"var(--green)"},
    {val:avgWin+"%",label:"Avg Win Rate",delta:avgWin>=55?"▲ Above baseline":"▼ Below 55% baseline",color:avgWin>=55?"var(--green)":"var(--red)"},
    {val:filtered.length,label:"Active Tenders",delta:"Open & qualified",color:"var(--fg)"},
    {val:urgent,label:"Due < 7 Days",delta:urgent?"Act now":"No urgent",color:urgent?"var(--amber)":"var(--green)"},
    {val:fmt(forecast),label:"Weighted Forecast",delta:"Probability adjusted",color:"var(--blue)"}
  ];
  stats.forEach(function(s){
    html+='<div style="text-align:center;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:12px">'
      +'<div style="font-size:28px;font-weight:700;letter-spacing:-.02em;color:'+s.color+'" class="sd-stat">'+s.val+'</div>'
      +'<div style="font-size:11px;color:var(--fg-faint);margin-top:2px;text-transform:uppercase;letter-spacing:.06em">'+s.label+'</div>'
      +'<div style="font-size:12px;font-weight:600;color:'+s.color+';margin-top:4px">'+s.delta+'</div></div>';
  });
  html+='</div>';

  /* Grid: funnel + forecast + win rate + workload + competitors + go/no-go */
  html+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px">';

  /* Pipeline funnel */
  var stages=["Infrastructure","Digital","Managed IT","Other"];
  var stageData=stages.map(function(s){
    var st=filtered.filter(function(t){return t._sd.sector===s});
    return{label:s,value:st.reduce(function(a,t){return a+t._sd.estValue},0),count:st.length};
  });
  var maxFunnel=Math.max.apply(null,stageData.map(function(s){return s.value}))||1;
  var funnelColors=["#3987e5","#199e70","#c98500","#666"];
  html+='<div class="sd-card"><div style="display:flex;justify-content:space-between;margin-bottom:14px"><span style="font-size:13px;font-weight:600;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.06em">Pipeline by Sector</span><span style="font-size:11px;padding:2px 8px;border-radius:20px;background:var(--green-soft);color:var(--green);font-weight:600">Live</span></div>';
  stageData.forEach(function(s,i){
    var pct=Math.max(3,Math.round(s.value/maxFunnel*100));
    html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">'
      +'<span style="width:90px;text-align:right;font-size:12px;color:var(--fg-muted)">'+s.label+'</span>'
      +'<div style="flex:1;height:28px;background:var(--bg);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+funnelColors[i]+';border-radius:4px 0 0 4px;display:flex;align-items:center;padding-left:8px;font-size:12px;font-weight:600;color:#fff">'+s.count+'</div></div>'
      +'<span style="width:70px;text-align:right;font-weight:600;font-size:13px">'+fmt(s.value)+'</span></div>';
  });
  html+='</div>';

  /* Revenue forecast by month */
  var months=["Nov","Dec","Jan","Feb"];
  var mIdx={Nov:10,Dec:11,Jan:0,Feb:1};
  var monthBars=months.map(function(m){
    var yr=mIdx[m]<10?2027:2026;
    var mTenders=filtered.filter(function(t){
      if(!t.cl)return false;
      var d=parsePortalDate(t.cl);
      return d&&d.getMonth()===mIdx[m]&&d.getFullYear()===yr;
    });
    return{label:m,value:mTenders.reduce(function(a,t){return a+Math.round(t._sd.estValue*(t._sd.winProb/100))},0)};
  });
  var maxBar=Math.max.apply(null,monthBars.map(function(b){return b.value}))||1;
  html+='<div class="sd-card"><div style="display:flex;justify-content:space-between;margin-bottom:14px"><span style="font-size:13px;font-weight:600;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.06em">Revenue Forecast</span><span style="font-size:11px;padding:2px 8px;border-radius:20px;background:var(--green-soft);color:var(--green);font-weight:600">Q4 2026</span></div>'
    +'<div class="bar-chart">';
  monthBars.forEach(function(b){
    var h=Math.max(3,Math.round(b.value/maxBar*100));
    html+='<div class="bar-col"><div style="font-size:11px;font-weight:600;color:var(--fg-muted)">'+fmt(b.value)+'</div><div class="bar" style="height:'+h+'%;background:var(--green)"></div><div style="font-size:10px;color:var(--fg-faint)">'+b.label+'</div></div>';
  });
  html+='</div></div>';

  /* Go/No-Go summary */
  var goCount=filtered.filter(function(t){return t._sd.goNogo==="go"}).length;
  var nogoCount=filtered.filter(function(t){return t._sd.goNogo==="nogo"}).length;
  var pendCount=filtered.filter(function(t){return t._sd.goNogo==="pending"}).length;
  html+='<div class="sd-card"><div style="margin-bottom:14px"><span style="font-size:13px;font-weight:600;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.06em">Go / No-Go Status</span></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">'
    +'<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:var(--green)" class="sd-stat">'+goCount+'</div><div style="font-size:11px;color:var(--fg-faint);text-transform:uppercase">Go</div></div>'
    +'<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:var(--red)" class="sd-stat">'+nogoCount+'</div><div style="font-size:11px;color:var(--fg-faint);text-transform:uppercase">No-Go</div></div>'
    +'<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:var(--amber)" class="sd-stat">'+pendCount+'</div><div style="font-size:11px;color:var(--fg-faint);text-transform:uppercase">Pending</div></div></div>';
  /* Competitor sightings */
  html+='<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:12px"><div style="font-size:12px;font-weight:600;color:var(--fg-faint);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em">Competitor Sightings</div>';
  SD_COMPETITORS.filter(function(c){return c.count>0}).forEach(function(c){
    html+='<div class="comp-row"><span style="font-size:13px;font-weight:600">'+c.name+'</span><span style="font-size:12px;padding:2px 8px;border-radius:12px;background:var(--green-soft);color:var(--green);font-weight:600">'+c.count+' tenders</span></div>';
  });
  if(!SD_COMPETITORS.some(function(c){return c.count>0}))html+='<div style="font-size:12px;color:var(--fg-faint)">No competitor data yet</div>';
  html+='</div></div>';
  html+='</div>';

  /* Team workload + table side by side */
  html+='<div style="display:grid;grid-template-columns:280px 1fr;gap:16px;margin-bottom:16px">';

  /* Workload */
  html+='<div class="sd-card"><div style="margin-bottom:14px"><span style="font-size:13px;font-weight:600;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.06em">Team Workload</span></div>';
  SD_TEAM.filter(function(m){return m.bids>0}).forEach(function(m){
    var capColor=m.capacity>=90?"var(--red)":m.capacity>=70?"var(--amber)":"var(--green)";
    html+='<div class="wl-row"><div class="wl-avatar" style="background:'+m.color+'">'+m.initials+'</div>'
      +'<div style="flex:1"><div style="font-size:13px;font-weight:600">'+m.name+'</div><div style="font-size:11px;color:var(--fg-faint)">'+m.bids+' bid'+(m.bids!==1?"s":"")+'</div></div>'
      +'<div style="height:6px;border-radius:3px;background:var(--bg);width:80px"><div style="height:100%;border-radius:3px;width:'+m.capacity+'%;background:'+capColor+'"></div></div>'
      +'<div style="width:36px;text-align:right;font-size:12px;font-weight:600;color:'+capColor+'">'+m.capacity+'%</div></div>';
  });
  html+='</div>';

  /* Live tender table */
  html+='<div class="sd-card" style="overflow:hidden;padding:0"><div style="padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)"><span style="font-size:13px;font-weight:600;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.06em">Live Tender Feed</span><span style="font-size:11px;color:var(--fg-faint)">'+filtered.length+' bids</span></div>'
    +'<div style="overflow-x:auto"><table><thead><tr><th>Tender</th><th>Sector</th><th>Value</th><th>Deadline</th><th>Win %</th><th>Assigned To</th><th>Go/No-Go</th><th>Actions</th></tr></thead><tbody>';
  filtered.forEach(function(t){
    var sd=t._sd;
    var urgCls=t.days!==null&&t.days<=3?"urg-crit":t.days!==null&&t.days<=7?"urg-ser":t.days!==null&&t.days<=14?"urg-warn":"urg-ok";
    var daysLabel=t.days!==null?(t.days<=0?"Overdue":t.days+"d"):"TBD";
    var goC=sd.goNogo==="go"?"go-go":sd.goNogo==="nogo"?"go-nogo":"go-pend";
    var goL=sd.goNogo==="go"?"● GO":sd.goNogo==="nogo"?"✕ NO-GO":"◐ Pending";

    html+='<tr>'
      +'<td onclick="FLT._detail=\''+t.id+'\';showView(\'detail\')" style="cursor:pointer;max-width:200px"><strong style="font-size:12px">'+t.ti.substring(0,50)+(t.ti.length>50?"...":"")+'</strong><br><span style="font-size:10px;color:var(--fg-faint)">'+(t.source||"Sindh Bank")+'</span></td>'
      +'<td><span style="font-size:10px;padding:2px 8px;border-radius:4px;background:var(--bg);color:var(--fg-muted);font-weight:600">'+sd.sector+'</span></td>'
      +'<td style="font-weight:700">'+fmt(sd.estValue)+'</td>'
      +'<td><span class="sd-badge '+urgCls+'">⏱ '+daysLabel+'</span></td>'
      +'<td style="font-weight:600">'+sd.winProb+'%</td>'
      +'<td><select onchange="sdAssign(\''+t.id+'\',this.value)" style="font-size:12px;padding:3px 6px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-family:inherit;max-width:120px">'
      +SD_TEAM.map(function(m){return'<option'+(sd.assignee===m.name?' selected':'')+'>'+m.name+'</option>'}).join('')
      +'</select></td>'
      +'<td><span class="sd-badge '+goC+'" onclick="sdCycleGo(\''+t.id+'\')">'+goL+'</span></td>'
      +'<td><button onclick="sdRemind(\''+t.id+'\')" style="padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:12px;cursor:pointer;font-family:inherit">✉</button></td>'
      +'</tr>';
  });
  if(!filtered.length)html+='<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--fg-faint)">No bids match filters</td></tr>';
  html+='</tbody></table></div></div>';
  html+='</div>';

  html+='</div>';
  return html;
}

function sdAssign(id,name){
  var t=T.find(function(x){return x.id===id});
  if(t&&t._sd){t._sd.assignee=name;if(DB)DB.doc("tenders/"+id).update({assignee:name}).catch(function(e){console.error(e)})}
  render();
}
function sdCycleGo(id){
  var t=T.find(function(x){return x.id===id});
  if(!t||!t._sd)return;
  var cycle={pending:"go",go:"nogo",nogo:"pending"};
  t._sd.goNogo=cycle[t._sd.goNogo];
  if(DB)DB.doc("tenders/"+id).update({goNogo:t._sd.goNogo}).catch(function(e){console.error(e)});
  render();
}
function sdRemind(id){
  var t=T.find(function(x){return x.id===id});
  if(!t||!t._sd)return;
  if(t._sd.assignee==="Unassigned"){alert("Assign an engineer first.");return}
  alert("Reminder dispatched to "+t._sd.assignee+" for "+t.id+" (deadline: "+(t.cl||"TBD")+")");
}

function exportSalesJSON(){
  var bids=T.filter(function(t){return t.score>=70&&t.open&&t._sc});
  var data=bids.map(function(t){
    var sc=t._sc;
    return{id:t.id,title:t.ti,portal:t.source||"Sindh Bank",sector:sc.sector,est_value_pkr:sc.estValue,win_probability:sc.winProb,deadline:t.cl||null,days_remaining:t.days,assigned_to:sc.assignee,go_nogo:sc.goNogo,score:t.score,solutions:t.solMatch.map(function(s){return s.name})};
  });
  var blob=new Blob([JSON.stringify({exported:new Date().toISOString(),pipeline_count:data.length,tenders:data},null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="NETS_Pipeline_"+new Date().toISOString().substring(0,10)+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
