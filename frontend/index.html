<style>
:root{--sidebar:#1a1f25;--sidebar-text:#c8cdd4;--sidebar-active:#2d3339;--sidebar-accent:#4CAF50;--bg:#f5f5f0;--card:#fff;--border:#e5e5e0;--fg:#1a1a1a;--fg-muted:#6b7280;--fg-faint:#9ca3af;--green:#16a34a;--green-soft:#f0fdf4;--green-border:#bbf7d0;--amber:#d97706;--amber-soft:#fffbeb;--amber-border:#fde68a;--red:#dc2626;--red-soft:#fef2f2;--red-border:#fecaca;--blue:#2563eb;--blue-soft:#eff6ff;font-family:'Inter',system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--card:#1a1f27;--border:#2a2f38;--fg:#e5e7eb;--fg-muted:#9ca3af;--fg-faint:#6b7280;--green-soft:#052e16;--green-border:#14532d;--amber-soft:#451a03;--amber-border:#78350f;--red-soft:#450a0a;--red-border:#7f1d1d;--blue-soft:#1e1b4b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111318;--card:#1a1f27;--border:#2a2f38;--fg:#e5e7eb;--fg-muted:#9ca3af;--fg-faint:#6b7280;--green-soft:#052e16;--green-border:#14532d;--amber-soft:#451a03;--amber-border:#78350f;--red-soft:#450a0a;--red-border:#7f1d1d;--blue-soft:#1e1b4b;color-scheme:dark}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5;display:flex;min-height:100vh}

/* ===== SIDEBAR ===== */
.sidebar{width:260px;background:var(--sidebar);color:var(--sidebar-text);padding:0;flex:none;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-logo{padding:24px 24px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo .nets-word{display:block;font-size:42px;font-weight:900;color:#555;letter-spacing:-.03em;line-height:.9;font-family:'Inter',sans-serif}
@media(prefers-color-scheme:dark){.sb-logo .nets-word{color:#bbb}}
:root[data-theme="dark"] .sb-logo .nets-word{color:#bbb}
.sb-logo .nets-swoosh{display:block;height:18px;margin-bottom:2px}
.sb-logo .tagline{display:block;font-size:9px;color:#4CAF50;letter-spacing:.08em;margin-top:6px;font-weight:500}
.sb-hdr{padding:20px 24px 6px}

.sb-nav{padding:16px 14px 8px;display:flex;flex-direction:column;gap:1px;flex:1}

.sb-item:hover{background:rgba(255,255,255,.06)}
.sb-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;border-left:3px solid var(--sidebar-accent);padding-left:11px}
.sb-badge{background:var(--sidebar-accent);color:#fff;font-size:10px;font-weight:700;padding:1px 8px;border-radius:10px;min-width:20px;text-align:center}
.sb-live{background:var(--sidebar-accent);color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.04em}
.sb-entity{padding:20px 24px;border-top:1px solid rgba(255,255,255,.08);margin-top:auto}
.sb-entity .label{font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;font-weight:600}

.sb-footer{padding:14px 24px;font-size:10px;color:rgba(255,255,255,.2);line-height:1.6}

/* ===== MAIN CONTENT ===== */
.main{flex:1;padding:36px 48px;min-width:0}
.greeting{font-size:30px;font-weight:800;color:var(--fg);letter-spacing:-.02em;margin-bottom:6px}
.date-line{font-size:13.5px;color:var(--fg-muted);margin-bottom:28px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 20px}
.kpi-card .label{font-size:12.5px;color:var(--fg-muted);margin-bottom:6px}
.kpi-card .num{font-size:32px;font-weight:800;color:var(--green);line-height:1}
.kpi-card .sub{font-size:11.5px;color:var(--fg-faint);margin-top:6px}
.sec-head{font-size:17px;font-weight:700;color:var(--fg);margin-bottom:14px;display:flex;align-items:baseline;gap:10px}
.sec-head .hint{font-size:12.5px;font-weight:400;color:var(--fg-faint)}
.action-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 20px;margin-bottom:8px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s}
.action-card:hover{border-color:var(--green);box-shadow:0 1px 6px rgba(0,0,0,.04)}
.action-card .info{flex:1;min-width:0}
.action-card .info .title{font-size:14.5px;font-weight:600;color:var(--fg)}
.action-card .info .detail{font-size:12.5px;color:var(--fg-muted);margin-top:3px}
.action-tag{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot-g{background:var(--green)}.dot-b{background:var(--blue)}.dot-a{background:var(--amber)}.dot-r{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.timeline{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px 22px}
.timeline .head{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:baseline;gap:10px}
.timeline .head .when{font-size:12.5px;font-weight:400;color:var(--fg-faint)}
.tl-item{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)}
.tl-item:last-child{border:none}
.tl-time{font-size:12px;color:var(--fg-faint);font-family:'Inter',monospace;min-width:48px;padding-top:1px;font-weight:500}
.tl-text{font-size:13.5px;color:var(--fg);line-height:1.5}
.split{display:grid;grid-template-columns:1fr 360px;gap:24px;margin-bottom:32px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-bar select{background:var(--card);border:1px solid var(--border);color:var(--fg);padding:7px 12px;border-radius:6px;font-size:12.5px;font-family:inherit}
.filter-bar .clear{font-size:12px;color:var(--green);cursor:pointer;font-weight:600;padding:7px 12px}
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:11px 16px;font-size:10.5px;font-weight:600;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--bg)}
td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover td{background:rgba(22,163,74,.02)}
tr{cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:4px;font-size:10.5px;font-weight:600}
.b-g{background:var(--green-soft);color:var(--green);border:1px solid var(--green-border)}
.b-a{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-border)}
.b-r{background:var(--red-soft);color:var(--red);border:1px solid var(--red-border)}
.b-grey{background:var(--bg);color:var(--fg-faint);border:1px solid var(--border)}
.b-b{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue)}
.drawer{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;margin-bottom:16px}
.drawer h2{font-size:18px;font-weight:700;margin-bottom:4px}
.drawer .meta{font-size:12px;color:var(--fg-muted);margin-bottom:16px}
.drawer .row{display:flex;gap:24px;margin-bottom:12px}
.drawer .row .col{flex:1}
.drawer .row .col .lbl{font-size:10px;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;font-weight:600}
.drawer .row .col .val{font-size:13.5px;font-weight:600}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px}
.loading-screen .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen .msg{font-size:14px;color:var(--fg-muted)}
.db-status{display:inline-flex;align-items:center;gap:4px;font-size:9px;padding:2px 6px;border-radius:3px;font-weight:600}
.db-live{background:rgba(76,175,80,.15);color:#4CAF50}
.db-off{background:rgba(220,38,38,.15);color:#dc2626}
@media(max-width:800px){body{flex-direction:column}.sidebar{width:100%;height:auto;position:relative}.sb-nav{flex-direction:row;overflow-x:auto;padding:8px 12px}.sb-logo,.sb-hdr,.sb-entity,.sb-footer{display:none}.main{padding:20px 16px}.split{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}}
</style>

<div class="main">
  <div id="content">
    <div class="loading-screen">
      <div class="spinner"></div>
      <div class="msg" id="loadMsg">Connecting to Artifact Database...</div>
    </div>
  </div>
</div>

<script>
/* ===== NETS SOLUTIONS (matching criteria, stays in HTML) ===== */
var SOLUTIONS=[
  {id:"fan",name:"Fixed Access Network",group:"Infrastructure",kw:["fibre","fiber","fttp","ftth","cable","cabling","structured cabling","optical","broadband"]},
  {id:"wan",name:"Wireless Access Network",group:"Infrastructure",kw:["wireless","wifi","wi-fi","access point","radio","microwave","antenna"]},
  {id:"elv",name:"ELV Systems",group:"Infrastructure",kw:["cctv","access control","surveillance","biometric","intercom","fire alarm","public address","elv","low voltage"]},
  {id:"ev",name:"EV Chargepoint",group:"Infrastructure",kw:["electric vehicle","chargepoint","ev charging","ev chargepoint"]},
  {id:"edn",name:"Enterprise Data Network",group:"Digital",kw:["network","networking","lan","wan","switch","router","switches","routers","sd-wan","data network"]},
  {id:"cloud",name:"Cloud Solutions",group:"Digital",kw:["cloud","virtualization","virtualisation","vmware","hyper-v","azure","aws"]},
  {id:"cyber",name:"Cyber Security",group:"Digital",kw:["cybersecurity","security","firewall","waf","siem","endpoint","threat","penetration"]},
  {id:"auto",name:"Automation",group:"Digital",kw:["automation","orchestration","scripting","rpa"]},
  {id:"ms",name:"Managed Services",group:"Managed IT",kw:["managed service","mssp","it support","helpdesk","maintenance","amc","support contract"]},
  {id:"ro",name:"Resource Outsourcing",group:"Managed IT",kw:["outsourcing","resource","staffing","contractor"]},
  {id:"noc",name:"NOC",group:"Managed IT",kw:["noc","monitoring","network operations"]},
  {id:"soc",name:"SOC",group:"Managed IT",kw:["soc","security operations","incident response"]},
  {id:"dc",name:"Data Centre",group:"Infrastructure",kw:["server","data centre","data center","storage","san","nas","backup","rack","ups","power","dell","hp","hpe"]},
  {id:"voice",name:"Telephony",group:"Digital",kw:["telephony","voip","pbx","unified communication","telephone","ip phone"]},
  {id:"solar",name:"Solar and Power",group:"Infrastructure",kw:["solar","pv","photovoltaic","inverter","battery","power supply","ups","generator"]}
];

/* ===== STATE (populated from db) ===== */
var T=[], LOG=[], SCANS=[], PROPOSALS=[], CONFIG={}, FLT={status:"all",solution:"all",dept:"all"};
/* RFP Workbench state: RFPA[tenderId] = {rfpText, summary, grading, compliance, boq, decision, ...} */
var RFPA={}, SAMPLE=null, ASSETS=null, DOWNLOADS=null;
var NOW=new Date();
var DB=null;
var _dbReady=false;
var _tenderUnsub=null, _scanUnsub=null;

/* ===== DATE PARSER ===== */
function parsePortalDate(s){
  if(!s)return null;
  s=s.trim();
  var m=s.match(/^(\d{1,2})\s*-\s*([A-Za-z]{3,})\s*-?\s*(\d{2,4})$/);
  if(m){var mon={jan:"01",feb:"02",mar:"03",apr:"04",may:"05",jun:"06",jul:"07",aug:"08",sep:"09",sept:"09",oct:"10",nov:"11",dec:"12"}[m[2].toLowerCase().substring(0,3)];if(!mon)return null;var yr=m[3].length===2?"20"+m[3]:m[3];return new Date(yr+"-"+mon+"-"+m[1].padStart(2,"0"))}
  var d=new Date(s);return isNaN(d)?null:d;
}

function fmt(d){var h=String(d.getHours()).padStart(2,"0");var m=String(d.getMinutes()).padStart(2,"0");return h+":"+m}

/* ===== INIT: connect to artifact db ===== */
(async function init(){
  var loadTimer=setTimeout(function(){
    document.getElementById("loadMsg").textContent="Database not available. Showing empty state.";
    _dbReady=false;
    showEmptyState();
  },10000);

  DB=await claude.use("db");
  if(!DB){
    clearTimeout(loadTimer);
    document.getElementById("loadMsg").textContent="Database not connected. Data will appear after the first agent scan.";
    showEmptyState();
    return;
  }

  clearTimeout(loadTimer);
  document.getElementById("dbStatusFooter").className="db-status db-live";
  document.getElementById("dbStatusFooter").textContent="Live";

  /* Subscribe to tenders collection: one snapshot, live updates */
  _tenderUnsub=DB.collection("tenders").onSnapshot(function(snap){
    T=snap.docs.filter(function(d){return d.exists}).map(function(d){
      var r=d.data();
      /* Rebuild solMatch from SOLUTIONS if stored as ids */
      var solMatch=r.solMatch||[];
      if(solMatch.length&&typeof solMatch[0]==="string"){
        solMatch=solMatch.map(function(sid){return SOLUTIONS.find(function(s){return s.id===sid})||{id:sid,name:sid,group:""}});
      }
      var cl=parsePortalDate(r.cl);
      var days=cl?Math.ceil((cl-NOW)/864e5):null;
      var isOpen=cl?cl>=NOW:false;
      return{
        id:r.id||d.id, ti:r.ti||"", dept:r.dept||"", ad:r.ad||"", cl:r.cl||"",
        doc:r.doc||"", score:r.score||0, verdict:r.verdict||"SKIP",
        solMatch:solMatch, matched:r.matched||[],
        open:isOpen, days:days,
        source:r.source_portal||r.source||"Sindh Bank",
        acqStatus:r.acquisition_status||"PENDING",
        detailUrl:r.detail_url||"",
        qualVerdict:r.qualVerdict||r.qual_verdict||"GO",
        qualGates:r.qualGates||r.qual_gates||{},
        dqReason:r.dqReason||r.disqualification_reason||null
      };
    });
    T.sort(function(a,b){return b.score-a.score});
    onDataReady();
  }, function(err){
    console.error("Tender subscription error:", err.code, err.message);
  });

  /* Subscribe to scans collection for activity log */
  _scanUnsub=DB.collection("scans").orderBy("date","desc").limit(30).onSnapshot(function(snap){
    SCANS=snap.docs.filter(function(d){return d.exists}).map(function(d){return d.data()});
    LOG=SCANS.map(function(s){
      var ts=s.timestamp?s.timestamp.substring(11,16):"05:47";
      return{time:ts,text:"Scan: "+s.total_on_portal+" total, "+s.qualified_count+" qualified, "+s.open_qualified_count+" open"};
    });
    if(LOG.length===0){
      LOG=[{time:"--:--",text:"No scans recorded yet. Agent 1 runs daily at 05:47 UK."}];
    }
    /* Subscribe to proposals */
    DB.collection("proposals").onSnapshot(function(snap){
      PROPOSALS=snap.docs.filter(function(d){return d.exists}).map(function(d){return Object.assign({_id:d.id},d.data())});
      if(_dbReady)render();
    },function(){});
    /* Subscribe to RFP Workbench analyses (Agents 2 to 5 output + architect decisions) */
    DB.collection("rfp_analysis").onSnapshot(function(snap){
      RFPA={};
      snap.docs.filter(function(d){return d.exists}).forEach(function(d){RFPA[d.id]=d.data()});
      if(_dbReady){buildNav();if(document.querySelector('.sb-item.active[data-v="workbench"]'))showView("workbench")}
    },function(){});
    /* Also read config */
    DB.doc("config/settings").get().then(function(snap){
      if(snap.exists)CONFIG=snap.data();
    }).catch(function(){});
    if(_dbReady)render();
  }, function(err){
    console.error("Scan subscription error:", err.code, err.message);
  });

  /* Optional runtime capabilities for the Workbench (each resolves null when unavailable) */
  claude.use("sample").then(function(s){SAMPLE=s}).catch(function(){});
  claude.use("assets").then(function(a){ASSETS=a}).catch(function(){});
  claude.use("downloads").then(function(d){DOWNLOADS=d}).catch(function(){});
})();

var _firstRender=true;
function onDataReady(){
  _dbReady=true;
  render();
}

function render(){
  if(_firstRender){
    _firstRender=false;
    buildNav();
    showView("overview");
  } else {
    /* Re-render current view */
    buildNav();
    var active=document.querySelector(".sb-item.active");
    var v=active?active.getAttribute("data-v"):"overview";
    showView(v);
  }
}

function showEmptyState(){
  T=[];LOG=[{time:"--:--",text:"Waiting for first agent scan..."}];SCANS=[];
  buildNav();showView("overview");
}

/* ===== SIDEBAR NAV ===== */
function buildNav(){
  var qc=T.filter(function(t){return t.score>=70&&t.open&&t.qualVerdict!=="NOGO"}).length;
  var pc=qc;
  var navEl=document.getElementById("sbnav");
  navEl.innerHTML=[
    {v:"overview",l:"Overview",badge:null,live:true},
    {v:"salesDash",l:"Sales Dashboard",badge:null,live:true},
    {v:"pipelineControl",l:"Pipeline & Bid Controls",badge:qc,live:true},
    {v:"qualified",l:"Qualified",badge:qc,live:false},
    {v:"workbench",l:"RFP Workbench",badge:Object.keys(RFPA||{}).length||null,live:true},
    {v:"proposals",l:"Proposals",badge:PROPOSALS.length||null,live:false},
    {v:"compliance",l:"Compliance",badge:null,live:false},
    {v:"activity",l:"Activity Log",badge:null,live:false},
    {v:"settings",l:"Settings / Technical Health",badge:null,live:false}
  ].map(function(n){
    var badgeHtml=n.badge==="Soon"?' <span class="sb-badge" style="background:var(--amber);font-size:8px;padding:1px 6px">SOON</span>':n.badge!==null?' <span class="sb-badge">'+n.badge+'</span>':"";
    return'<div class="sb-item'+(n.v==="overview"?" active":"")+'" data-v="'+n.v+'" onclick="showView(\''+n.v+'\')">'+n.l+(n.live?' <span class="sb-live">LIVE</span>':"")+badgeHtml+'</div>';
  }).join("");
}

function showView(v){
  document.querySelectorAll(".sb-item").forEach(function(el){el.classList.toggle("active",el.getAttribute("data-v")===v)});
  var c=document.getElementById("content");
  var views={overview:vOverview,pipelineControl:vPipelineControl,salesDash:vSalesDash,qualified:vQualified,workbench:vWorkbench,proposals:vProposals,compliance:vCompliance,activity:vActivity,pipeline:vPipeline,settings:vSettings,detail:vDetail,proposalDetail:vProposalDetail};
  c.innerHTML=(views[v]||vOverview)();
  if(v==="workbench"&&typeof wbAfterRender==="function")wbAfterRender();
}

/* ===== OVERVIEW \u2014 PUBLIC TENDER INTELLIGENCE DASHBOARD ===== */
function vOverview(){
  /* ═══ DATA ═══
     "Discovered" = score >= 70 AND open (all tenders that match NETS domains and are live on portals).
     "Qualified"  = Discovered AND qualification gates passed (qualVerdict !== "NOGO").
     "Disqualified" = Discovered BUT failed a hard gate (turnover, OEM, etc.). */
  var discovered=T.filter(function(t){return t.score>=70&&t.open});
  var disqualified=discovered.filter(function(t){return t.qualVerdict==="NOGO"});
  var live=discovered.filter(function(t){return t.qualVerdict!=="NOGO"});
  var lastScan=SCANS.length?SCANS[0].date:"pending";
  var totalPortal=SCANS.length?SCANS[0].total_on_portal:T.length;
  var newSinceLastScan=SCANS.length&&SCANS[0].new_count?SCANS[0].new_count:0;

  /* Portal breakdown (live qualified only) */
  var sindhLive=live.filter(function(t){return !t.source||t.source==="Sindh Bank"});
  var ppraLive=live.filter(function(t){return t.source==="PPRA"});
  var epadsLive=live.filter(function(t){return t.source==="EPADS"});

  /* Pipeline stages: each tender sits in exactly one stage */
  var stgDiscovery=[];  /* scored but no RFP yet, no proposal */
  var stgRfpAcquired=[]; /* RFP document obtained */
  var stgProposal=[];   /* proposal drafted */
  var stgAuditPass=[];  /* proposal passed compliance */

  live.forEach(function(t){
    var wb=RFPA[t.id]||{};
    var hasRfp=t.doc||t.acqStatus==="AUTO_DOWNLOADED"||t.acqStatus==="MANUAL_UPLOADED"||!!wb.rfpText;
    var hasProposal=PROPOSALS.some(function(p){return p._id===t.id})||!!wb.boq;
    var passedAudit=PROPOSALS.some(function(p){return p._id===t.id&&p.audit_verdict==="PASS"})||(wb.decision&&wb.decision.bid_decision==="BID");
    if(passedAudit){stgAuditPass.push(t)}
    else if(hasProposal){stgProposal.push(t)}
    else if(hasRfp){stgRfpAcquired.push(t)}
    else{stgDiscovery.push(t)}
  });

  /* Compute estimated value per tender (once) */
  var fmtV=function(n){if(n>=1e6)return"PKR "+(n/1e6).toFixed(1)+"M";if(n>=1e3)return"PKR "+(n/1e3).toFixed(0)+"K";return"PKR "+n};
  function ensureVal(t){if(!t._sd)t._sd={estValue:Math.round((t.score/100)*800000+(t.solMatch.length*150000)),winProb:t.score>=95?65:t.score>=85?55:t.score>=75?45:35};return t._sd.estValue}
  var pipelineVal=0;
  live.forEach(function(t){pipelineVal+=ensureVal(t)});
  function stgVal(arr){var s=0;arr.forEach(function(t){s+=ensureVal(t)});return s}

  /* Urgency */
  var closing48=live.filter(function(t){return t.days!==null&&t.days<=2});
  var closing7=live.filter(function(t){return t.days!==null&&t.days<=7});
  var manualDL=live.filter(function(t){return t.acqStatus==="MANUAL_DOWNLOAD_REQUIRED"||(!t.doc&&t.acqStatus!=="AUTO_DOWNLOADED"&&stgDiscovery.indexOf(t)>=0)});

  var html='';

  /* ── 1. MORNING BRIEF ── */
  var hour=new Date().getHours();
  var greeting=hour<12?"Good morning":"Good afternoon";
  var briefParts=[];
  if(newSinceLastScan>0)briefParts.push(newSinceLastScan+" new tender"+(newSinceLastScan>1?"s":"")+" found overnight");
  if(closing48.length)briefParts.push(closing48.length+" closing in 48 hours");
  else if(closing7.length)briefParts.push(closing7.length+" closing this week");
  else briefParts.push("no urgent deadlines");
  if(manualDL.length)briefParts.push(manualDL.length+" manual download"+(manualDL.length>1?"s":"")+" pending");

  html+='<div style="background:var(--sidebar);border-radius:10px;padding:24px 28px;margin-bottom:16px;color:#fff">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start">'
    +'<div>'
    +'<div style="font-size:10px;color:#4CAF50;text-transform:uppercase;letter-spacing:.15em;font-weight:700;margin-bottom:6px">NETS Tender Scout</div>'
    +'<div style="font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px">'+greeting+', Manal</div>'
    +'<div style="font-size:13px;color:rgba(255,255,255,.7);line-height:1.6">'+briefParts.join(". ")+'.</div>'
    +'</div>'
    +'<div style="text-align:right">'
    +'<div style="display:inline-flex;align-items:center;gap:6px;background:#16a34a;color:#fff;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.04em;margin-bottom:6px"><span style="width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite"></span>LIVE</div>'
    +'<div style="font-size:11px;color:rgba(255,255,255,.35)">Last scan: '+lastScan+'</div>'
    +'<div style="font-size:10px;color:rgba(255,255,255,.3);margin-top:2px">Sindh Bank + PPRA + EPADS</div>'
    +'</div></div></div>';

  /* ── 2. DEADLINE ALERTS ── */
  if(closing48.length){
    html+='<div style="background:var(--red-soft);border:1px solid var(--red-border);border-radius:8px;padding:12px 18px;margin-bottom:12px;display:flex;align-items:center;gap:10px">'
      +'<span style="font-size:18px">\u26a0\ufe0f</span><div>'
      +'<div style="font-size:12px;font-weight:700;color:var(--red)">CLOSING IN 48 HOURS</div>';
    closing48.forEach(function(t){
      html+='<div style="font-size:12px;color:var(--fg);margin-top:2px;cursor:pointer" onclick="FLT._detail=\''+t.id+'\';showView(\'detail\')"><strong>'+t.ti.substring(0,60)+'</strong> \u00b7 '+(t.cl||"")+(t.days!==null?" ("+t.days+"d)":"")+'</div>';
    });
    html+='</div></div>';
  }else if(closing7.length){
    html+='<div style="background:var(--amber-soft);border:1px solid var(--amber-border);border-radius:8px;padding:12px 18px;margin-bottom:12px;display:flex;align-items:center;gap:10px">'
      +'<span style="font-size:16px">\u23f0</span><div><div style="font-size:12px;font-weight:700;color:var(--amber)">CLOSING THIS WEEK: '+closing7.length+' tender'+(closing7.length>1?"s":"")+'</div>';
    closing7.slice(0,3).forEach(function(t){
      html+='<div style="font-size:12px;color:var(--fg);margin-top:2px;cursor:pointer" onclick="FLT._detail=\''+t.id+'\';showView(\'detail\')">'+t.ti.substring(0,50)+' \u00b7 '+t.days+'d left</div>';
    });
    html+='</div></div>';
  }

  /* ── RFP ACQUISITION ALERT ── */
  var autoD=live.filter(function(t){return t.acqStatus==="AUTO_DOWNLOADED"});
  var pendingD=live.filter(function(t){return t.acqStatus==="PENDING"&&!t.doc});
  var manualReq=live.filter(function(t){return t.acqStatus==="MANUAL_DOWNLOAD_REQUIRED"});

  if(manualReq.length||pendingD.length){
    var alertColor=manualReq.length?"var(--amber-soft)":"var(--blue-soft)";
    var alertBorder=manualReq.length?"var(--amber-border)":"var(--border)";
    var alertTextColor=manualReq.length?"var(--amber)":"var(--blue)";
    html+='<div style="background:'+alertColor+';border:1px solid '+alertBorder+';border-radius:8px;padding:14px 18px;margin-bottom:12px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
      +'<div style="font-size:12px;font-weight:700;color:'+alertTextColor+'">RFP DOCUMENT STATUS</div>'
      +'<span style="font-size:11px;color:var(--fg-muted)">'+autoD.length+' downloaded \u00b7 '+manualReq.length+' need manual download \u00b7 '+pendingD.length+' pending</span></div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap">';

    /* Auto-downloaded summary */
    if(autoD.length)html+='<div style="background:var(--green-soft);border:1px solid var(--green-border);border-radius:6px;padding:6px 12px;font-size:11px;color:var(--green);font-weight:600">\u2705 '+autoD.length+' RFPs auto-downloaded to D:\\ drive</div>';

    /* Manual download needed */
    if(manualReq.length)html+='<div style="background:var(--card);border:1px solid var(--amber-border);border-radius:6px;padding:6px 12px;font-size:11px;color:var(--amber);font-weight:600;cursor:pointer" onclick="showView(\'qualified\')">\u26a0\ufe0f '+manualReq.length+' need your manual download \u2192</div>';

    /* Pending (not yet processed by Agent 1b) */
    if(pendingD.length)html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:11px;color:var(--fg-muted)">\u23f3 '+pendingD.length+' awaiting Agent 1b processing</div>';

    html+='</div></div>';
  }

  /* ── 3. TOP ROW: Pipeline Value + Portal Breakdown + Discovery Funnel ── */
  html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">';

  /* Pipeline Value (the big number) */
  html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 20px">'
    +'<div style="font-size:10px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Live Pipeline Value</div>'
    +'<div style="font-size:32px;font-weight:800;color:var(--green);line-height:1">'+fmtV(pipelineVal)+'</div>'
    +'<div style="font-size:10px;color:var(--fg-faint);margin-top:6px">'+live.length+' qualified live tenders</div></div>';

  /* Portal Totals (3 portals) */
  html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 20px">'
    +'<div style="font-size:10px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">3 Portals Scanned</div>'
    +'<div style="font-size:14px;font-weight:700;color:var(--fg);margin-top:8px">'+totalPortal+' total on portals</div>'
    +'<div style="display:flex;gap:8px;margin-top:8px">'
    +'<div style="flex:1;background:var(--bg);border-radius:6px;padding:6px 8px;text-align:center">'
    +'<div style="font-size:18px;font-weight:800;color:var(--amber)">'+sindhLive.length+'</div>'
    +'<div style="font-size:8px;color:var(--fg-faint);margin-top:2px">Sindh Bank</div></div>'
    +'<div style="flex:1;background:var(--bg);border-radius:6px;padding:6px 8px;text-align:center">'
    +'<div style="font-size:18px;font-weight:800;color:var(--green)">'+ppraLive.length+'</div>'
    +'<div style="font-size:8px;color:var(--fg-faint);margin-top:2px">PPRA EPMS</div></div>'
    +'<div style="flex:1;background:var(--bg);border-radius:6px;padding:6px 8px;text-align:center">'
    +'<div style="font-size:18px;font-weight:800;color:var(--blue)">'+epadsLive.length+'</div>'
    +'<div style="font-size:8px;color:var(--fg-faint);margin-top:2px">EPADS</div></div>'
    +'</div></div>';

  /* Discovery Funnel: Discovered > Qualified > Disqualified */
  html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 20px">'
    +'<div style="font-size:10px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Agent 1 Discovery</div>'
    +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">'
    +'<span style="font-size:22px;font-weight:800;color:var(--fg)">'+discovered.length+'</span>'
    +'<span style="font-size:11px;color:var(--fg-muted)">discovered (NETS match + live)</span></div>'
    +'<div style="display:flex;gap:8px;margin-top:6px">'
    +'<div style="flex:1;background:var(--green-soft);border:1px solid var(--green-border);border-radius:6px;padding:8px;text-align:center;cursor:pointer" onclick="showView(\'qualified\')">'
    +'<div style="font-size:20px;font-weight:800;color:var(--green)">'+live.length+'</div>'
    +'<div style="font-size:8px;color:var(--green);text-transform:uppercase;letter-spacing:.03em">Qualified</div></div>'
    +(disqualified.length?'<div style="flex:1;background:var(--red-soft);border:1px solid var(--red-border);border-radius:6px;padding:8px;text-align:center">'
    +'<div style="font-size:20px;font-weight:800;color:var(--red)">'+disqualified.length+'</div>'
    +'<div style="font-size:8px;color:var(--red);text-transform:uppercase;letter-spacing:.03em">Disqualified</div></div>':'')
    +'</div></div>';

  html+='</div>';

  /* ── 4. PIPELINE STAGES (where each tender sits, with value) ── */
  var pStages=[
    {label:"Discovery",desc:"Scored but no RFP acquired yet",tenders:stgDiscovery,color:"#1B5E20",icon:"\ud83d\udd0d"},
    {label:"RFP Acquired",desc:"Document downloaded or available",tenders:stgRfpAcquired,color:"#2E7D32",icon:"\ud83d\udcc4"},
    {label:"BOQ Drafted",desc:"Summary, grading, compliance and BOQ produced in the Workbench",tenders:stgProposal,color:"#388E3C",icon:"\u270d\ufe0f"},
    {label:"BID Decided",desc:"Presales architect committed to bid",tenders:stgAuditPass,color:"#4CAF50",icon:"\u2705"}
  ];

  html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px">'
    +'<div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg);margin-bottom:14px">Pipeline Stages</div>';

  /* Stage summary bar */
  html+='<div style="display:flex;gap:0;margin-bottom:16px">';
  pStages.forEach(function(st,i){
    var w=Math.max(15,live.length?Math.round((st.tenders.length/live.length)*100):25);
    html+='<div style="flex:'+w+';background:'+st.color+';padding:14px 6px 10px;text-align:center;color:#fff;'
      +(i===0?'border-radius:8px 0 0 8px;':'')+(i===pStages.length-1?'border-radius:0 8px 8px 0;':'')+'">'
      +'<div style="font-size:22px;font-weight:800;line-height:1">'+st.tenders.length+'</div>'
      +'<div style="font-size:7px;text-transform:uppercase;letter-spacing:.04em;opacity:.85;margin-top:3px">'+st.label+'</div>'
      +'<div style="font-size:8px;opacity:.7;margin-top:2px">'+fmtV(stgVal(st.tenders))+'</div></div>';
    if(i<pStages.length-1)html+='<div style="color:var(--fg-faint);font-size:12px;display:flex;align-items:center;padding:0 1px">\u25b8</div>';
  });
  html+='</div>';

  /* Expandable tender list per stage */
  pStages.forEach(function(st){
    if(!st.tenders.length)return;
    html+='<div style="margin-bottom:12px">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
      +'<span style="font-size:14px">'+st.icon+'</span>'
      +'<span style="font-size:12px;font-weight:700;color:var(--fg)">'+st.label+'</span>'
      +'<span style="font-size:11px;color:var(--fg-muted)">'+st.tenders.length+' tenders \u00b7 '+fmtV(stgVal(st.tenders))+'</span></div>';

    st.tenders.sort(function(a,b){return(a.days||999)-(b.days||999)});
    st.tenders.slice(0,5).forEach(function(t){
      var urgTag="";
      if(t.days!==null&&t.days<=3)urgTag='<span style="color:var(--red);font-weight:700;font-size:10px;margin-left:6px">'+t.days+'d!</span>';
      else if(t.days!==null&&t.days<=7)urgTag='<span style="color:var(--amber);font-size:10px;margin-left:6px">'+t.days+'d</span>';
      else if(t.days!==null)urgTag='<span style="color:var(--fg-faint);font-size:10px;margin-left:6px">'+t.days+'d</span>';

      html+='<div style="display:flex;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);cursor:pointer;gap:10px" onclick="FLT._detail=\''+t.id+'\';showView(\'detail\')">'
        +'<span style="font-size:14px;font-weight:800;color:'+(t.score>=85?"var(--green)":"var(--amber)")+';width:30px;text-align:center">'+t.score+'</span>'
        +'<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+t.ti+'</div>'
        +'<div style="font-size:10px;color:var(--fg-faint)">'+t.id+' \u00b7 '+(t.source||"Sindh Bank")+' \u00b7 '+fmtV(ensureVal(t))+urgTag+'</div></div>'
        +'<span style="font-size:10px;color:var(--fg-faint)">\u2192</span></div>';
    });
    if(st.tenders.length>5)html+='<div style="font-size:11px;color:var(--green);cursor:pointer;margin-top:4px;font-weight:600" onclick="showView(\'qualified\')">'+(st.tenders.length-5)+' more \u2192</div>';
    html+='</div>';
  });

  html+='</div>';

  /* ── 5. ACTION ITEMS ── */
  var actionItems=[];
  manualDL.slice(0,3).forEach(function(t){
    actionItems.push({icon:"\ud83d\udcc4",text:t.ti.substring(0,50),detail:"RFP needs manual download from "+(t.source||"portal"),color:"var(--red)",action:"pipelineControl"});
  });
  closing7.filter(function(t){return !PROPOSALS.some(function(p){return p._id===t.id})}).slice(0,3).forEach(function(t){
    actionItems.push({icon:"\u23f1\ufe0f",text:t.ti.substring(0,50),detail:"Closes in "+t.days+"d, no proposal started",color:"var(--red)",action:"qualified"});
  });

  if(actionItems.length){
    html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 20px;margin-bottom:16px">'
      +'<div style="font-size:13px;font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg)">Action Required <span style="font-size:11px;font-weight:400;color:var(--fg-faint);text-transform:none;letter-spacing:0">'+actionItems.length+' item'+(actionItems.length>1?"s":"")+'</span></div>';
    actionItems.forEach(function(a){
      html+='<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="showView(\''+a.action+'\')">'
        +'<span style="font-size:16px;flex:none;width:24px;text-align:center">'+a.icon+'</span>'
        +'<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;color:var(--fg)">'+a.text+'</div><div style="font-size:11px;color:'+a.color+'">'+a.detail+'</div></div>'
        +'<span style="font-size:11px;color:var(--fg-faint)">\u2192</span></div>';
    });
    html+='</div>';
  }

  /* ── 6. TENDER FEED (top 10 by urgency) ── */
  var feed=live.slice().sort(function(a,b){if(a.days!==null&&b.days!==null)return a.days-b.days;if(a.days!==null)return -1;return b.score-a.score}).slice(0,10);

  html+='<div style="margin-bottom:16px">'
    +'<div class="sec-head">Live Tender Feed <span class="hint">'+live.length+' live \u00b7 showing top 10 by urgency</span></div>'
    +'<div class="tbl-wrap"><table><thead><tr>'
    +'<th>Tender</th><th>Portal</th><th>Score</th><th>Est. Value</th><th>Stage</th><th>Deadline</th><th>RFP</th>'
    +'</tr></thead><tbody>';
  feed.forEach(function(t){
    var urgency="";
    if(t.days!==null){
      if(t.days<=2)urgency='<span style="color:var(--red);font-weight:700;font-size:10px">'+t.days+'d!</span>';
      else if(t.days<=7)urgency='<span style="color:var(--amber);font-size:10px">'+t.days+'d</span>';
      else urgency='<span style="color:var(--fg-faint);font-size:10px">'+t.days+'d</span>';
    }
    /* Determine stage label */
    var stLabel="Discovery";
    if(stgAuditPass.indexOf(t)>=0)stLabel="Audit Passed";
    else if(stgProposal.indexOf(t)>=0)stLabel="Proposal";
    else if(stgRfpAcquired.indexOf(t)>=0)stLabel="RFP Acquired";
    var stColor=stLabel==="Audit Passed"?"b-g":stLabel==="Proposal"?"b-a":stLabel==="RFP Acquired"?"b-g":"";
    var rfpBadge=t.acqStatus==="AUTO_DOWNLOADED"?'<span class="badge b-g" style="font-size:8px">\u2713 DL</span>':t.acqStatus==="MANUAL_DOWNLOAD_REQUIRED"?'<span class="badge b-a" style="font-size:8px">Manual</span>':t.doc?'<span class="badge b-g" style="font-size:8px">PDF</span>':'<span style="color:var(--fg-faint)">\u2014</span>';

    html+='<tr onclick="FLT._detail=\''+t.id+'\';showView(\'detail\')" style="cursor:pointer">'
      +'<td><strong style="font-size:12px">'+t.ti.substring(0,50)+(t.ti.length>50?"...":"")+'</strong><br><span style="font-size:9px;color:var(--fg-faint)">'+t.id+'</span></td>'
      var pBadge=t.source==="PPRA"?"b-g":t.source==="EPADS"?"b-b":"b-a";
      html+='<td><span class="badge '+pBadge+'" style="font-size:8px">'+(t.source||"SB")+'</span></td>'
      +'<td style="text-align:center"><span style="font-size:16px;font-weight:800;color:'+(t.score>=85?"var(--green)":"var(--amber)")+'">'+t.score+'</span></td>'
      +'<td style="font-size:11px;font-weight:600;color:var(--fg-muted)">'+fmtV(ensureVal(t))+'</td>'
      +'<td><span class="badge '+stColor+'" style="font-size:8px">'+stLabel+'</span></td>'
      +'<td style="white-space:nowrap;font-size:11px">'+(t.cl||"")+' '+urgency+'</td>'
      +'<td style="text-align:center">'+rfpBadge+'</td>'
      +'</tr>';
  });
  if(!feed.length)html+='<tr><td colspan="7" style="text-align:center;color:var(--fg-faint);padding:20px">No live tenders. Next scan: tomorrow 05:47 UK.</td></tr>';
  html+='</tbody></table></div>';
  if(live.length>10)html+='<div style="text-align:center;margin-top:8px"><span style="font-size:12px;color:var(--green);cursor:pointer;font-weight:600" onclick="showView(\'qualified\')">'+(live.length-10)+' more tenders \u2192</span></div>';
  html+='</div>';

  /* ── 7. AGENT STATUS STRIP ── */
  var agents=[
    {name:"Agent 1: Ingestion",dot:"g",info:"05:47 UK daily"},
    {name:"Agent 1b: D:\\\\ Sync",dot:"g",info:"Path A/B routing"},
    {name:"Agent 2: RAG",dot:"g",info:"1,481 chunks"},
    {name:"Agent 3: Writer",dot:"g",info:"Proposal gen"},
    {name:"Agent 4+5: Audit",dot:"g",info:"Tech + Regulatory"},
    {name:"DB",dot:DB?"g":"r",info:DB?"Live":"Offline"}
  ];
  html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 16px;display:flex;gap:0;flex-wrap:wrap">';
  agents.forEach(function(a,i){
    html+='<div style="flex:1;min-width:80px;padding:5px 6px;'+(i<agents.length-1?'border-right:1px solid var(--border);':'')+'">'
      +'<div style="display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--fg)"><span class="dot dot-'+a.dot+'"></span>'+a.name+'</div>'
      +'<div style="font-size:8px;color:var(--fg-faint);margin-top:1px">'+a.info+'</div></div>';
  });
  html+='</div>';

  return html;
}

/* ===== QUALIFICATION GATES PANEL ===== */
function renderQualGates(t){
  var g=t.qualGates||{};
  var turnoverGate=g.turnover_under_2b||{pass:true,status:"ASSUMED_PASS",detail:"No turnover requirement detected"};
  var oemGate=g.oem_partnership_matched||{pass:true,status:"ASSUMED_PASS",detail:"No specific OEM level requirement detected"};
  var domainGate=g.domain_expertise_matched||{pass:t.solMatch&&t.solMatch.length>0,status:t.solMatch&&t.solMatch.length>0?"PASS":"FAIL",detail:t.solMatch&&t.solMatch.length>0?"Matched via keyword scoring":"No NETS domain match"};
  var orgGate=g.organizational_history_met||{pass:true,status:"ASSUMED_PASS",detail:"Standard 3 to 5 year ICT experience assumed met"};
  var resGate=g.qualified_resources_met||{pass:true,status:"ASSUMED_PASS",detail:"OEM certified engineers assumed available"};

  var allPass=turnoverGate.pass&&oemGate.pass&&domainGate.pass&&orgGate.pass&&resGate.pass;
  var qv=t.qualVerdict||"GO";
  /* Force override check */
  if(t._forceOverride)allPass=true;

  function gateIcon(gate){
    if(!gate.pass)return'<span style="color:var(--red);font-weight:700">❌ Fail</span>';
    if(gate.status==="ASSUMED_PASS")return'<span style="color:var(--amber)">🟡 Assumed</span>';
    return'<span style="color:var(--green)">✅ Pass</span>';
  }

  var html='<div class="drawer" style="margin-top:16px">';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  html+='<div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em">RFP Qualification Gates</div>';
  if(t._forceOverride){
    html+='<span class="badge b-a" style="font-size:12px;padding:6px 12px">⚠️ OVERRIDE ACTIVE</span>';
  }else{
    html+=allPass
      ?'<span class="badge b-g" style="font-size:12px;padding:6px 12px">✅ ELIGIBLE TO BID</span>'
      :'<span class="badge b-r" style="font-size:12px;padding:6px 12px">❌ DISQUALIFIED (NO-GO)</span>';
  }
  html+='</div>';

  var rows=[
    {name:"1. Annual Turnover Limit",rule:"Must not exceed PKR 2 Billion",status:turnoverGate.detail,gate:turnoverGate},
    {name:"2. OEM Partnership Levels",rule:"Cisco (Gold), Huawei (Silver+), Dell (Gold), Fortinet (Adv)",status:oemGate.detail,gate:oemGate},
    {name:"3. Technology Domain Experience",rule:"SD-WAN, ACI, NGFW, FTTH, NMS, UC, Cybersecurity",status:t.solMatch.length?t.solMatch.map(function(s){return s.name}).join(", "):"No match",gate:domainGate},
    {name:"4. Organizational Experience",rule:"3 to 5 years ICT/DC project history with PO references",status:orgGate.detail,gate:orgGate},
    {name:"5. Qualified Technical Resources",rule:"OEM certified engineers (CCIE, CCNP, HCIP, NSE, VCP)",status:resGate.detail,gate:resGate},
    {name:"6. Pre-Bid Compliance",rule:"OEM Deal Lock and National Engineer document",status:"KAM registration pending",gate:{pass:true,status:"ASSUMED_PASS"}}
  ];

  html+='<div class="tbl-wrap"><table><thead><tr><th>Evaluation Criteria</th><th>Requirement Rule</th><th>NETS Status</th><th>Gate</th></tr></thead><tbody>';
  rows.forEach(function(r){
    html+='<tr><td style="font-weight:600;font-size:12px">'+r.name+'</td>'
      +'<td style="font-size:11px;color:var(--fg-muted)">'+r.rule+'</td>'
      +'<td style="font-size:11px">'+r.status+'</td>'
      +'<td style="text-align:center">'+gateIcon(r.gate)+'</td></tr>';
  });
  html+='</tbody></table></div>';

  /* Disqualification reason */
  if(t.dqReason&&!t._forceOverride){
    html+='<div style="margin-top:10px;padding:10px 14px;background:var(--red-soft);border:1px solid var(--red-border);border-radius:6px;font-size:12px;color:var(--red)">'
      +'<strong>Disqualification reason:</strong> '+t.dqReason+'</div>';
  }

  /* Force override button for Bid Director */
  if(!allPass&&!t._forceOverride){
    html+='<div style="margin-top:12px;display:flex;justify-content:flex-end">'
      +'<button onclick="forceOverrideTender(\''+t.id+'\')" style="background:var(--amber);color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">⚠️ Force Override and Enable Bid</button></div>';
  }
  if(t._forceOverride){
    html+='<div style="margin-top:8px;font-size:11px;color:var(--amber)">This tender was manually overridden by a Bid Director. Original verdict: '+qv+'.</div>';
  }

  html+='</div>';
  return html;
}

function forceOverrideTender(tid){
  var t=T.find(function(x){return x.id===tid});
  if(!t)return;
  t._forceOverride=true;
  t.qualVerdict="OVERRIDE";
  showView("detail");
}

/* ===== TENDER DETAIL ===== */
function vDetail(){
  var t=T.find(function(x){return x.id===FLT._detail});
  if(!t)return'<div class="sec-head">Tender not found</div>';
  var sols=t.solMatch.length?t.solMatch.map(function(s){return'<span class="badge b-g" style="font-size:12px;padding:4px 12px">'+(s.group?s.group+': ':'')+s.name+'</span>'}).join(" "):'<span style="color:var(--fg-faint)">No NETS solution match</span>';

  /* AI Opportunity Score breakdown \u2014 derived from solution matches */
  var capFit=Math.min(100,t.score+(t.solMatch.length>2?5:0));
  var stratFit=t.score>=85?96:t.score>=70?82:50;
  var prevExp=t.solMatch.length>=2?95:t.solMatch.length===1?70:30;
  var geoFit=100; /* Sindh Bank = Pakistan = NETS territory */
  var deadlineFeas=t.open?(t.days>=14?95:t.days>=7?78:t.days>=3?55:30):0;
  var aiScore=Math.round((capFit+stratFit+prevExp+geoFit+deadlineFeas)/5);
  var scoreBreakdown=[
    {dim:"Capability Fit",val:capFit},{dim:"Strategic Fit",val:stratFit},
    {dim:"Previous Experience",val:prevExp},{dim:"Geographic Fit",val:geoFit},
    {dim:"Deadline Feasibility",val:deadlineFeas}
  ];

  /* Requirement extraction \u2014 from matched keywords/solutions */
  var reqs=t.solMatch.map(function(s){
    return{req:s.name,found:true,ours:true,gap:"None"};
  });
  if(t.matched&&t.matched.length){
    t.matched.forEach(function(kw){
      if(!reqs.some(function(r){return r.req.toLowerCase()===kw.toLowerCase()})){
        reqs.push({req:kw,found:true,ours:true,gap:"None"});
      }
    });
  }

  return'<div style="margin-bottom:12px"><span class="clear" onclick="showView(\'overview\')">\u2190 Back to Overview</span></div>'
    +'<div class="drawer">'
    +'<h2>'+t.ti+'</h2>'
    +'<div class="meta">'+t.id+' \u00b7 '+(t.dept?t.dept+' Department \u00b7 ':'')+(t.source||'Sindh Bank')+'</div>'
    +'<div class="row"><div class="col"><div class="lbl">Portal</div><div class="val">'+(t.source==="PPRA"?"epms.ppra.gov.pk":"sindhbank.com.pk")+'</div></div><div class="col"><div class="lbl">Advertised</div><div class="val">'+t.ad+'</div></div><div class="col"><div class="lbl">Deadline</div><div class="val" style="font-weight:700;color:'+(t.open&&t.days<=7?"var(--red)":"var(--fg)")+'">'+t.cl+(t.open?' ('+t.days+'d)':'')+'</div></div></div>'
    +'<div class="row"><div class="col"><div class="lbl">Status</div><div class="val">'+(t.open?'<span class="badge b-g" style="font-size:13px;padding:4px 14px">Open</span>':'<span class="badge b-grey" style="font-size:13px;padding:4px 14px">Closed</span>')+'</div></div><div class="col"><div class="lbl">Verdict</div><div class="val"><span class="badge '+(t.verdict==="BID"?"b-g":t.verdict==="REVIEW"?"b-a":"b-grey")+'" style="font-size:13px;padding:4px 14px">'+t.verdict+'</span></div></div><div class="col"><div class="lbl">Department</div><div class="val">'+t.dept+'</div></div></div>'
    +'</div>'

    /* AI Opportunity Score */
    +'<div class="drawer" style="margin-top:16px">'
    +'<div style="display:flex;align-items:center;gap:20px;margin-bottom:16px"><div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em">AI Opportunity Score</div><div style="font-size:36px;font-weight:800;color:'+(aiScore>=80?"var(--green)":aiScore>=60?"var(--amber)":"var(--red)")+'">'+aiScore+'<span style="font-size:16px;font-weight:400;color:var(--fg-faint)">/100</span></div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
    +scoreBreakdown.map(function(s){
      var c=s.val>=80?"var(--green)":s.val>=60?"var(--amber)":"var(--red)";
      var pct=s.val+'%';
      return'<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border-radius:6px">'
        +'<div style="flex:1;font-size:12px;color:var(--fg-muted)">'+s.dim+'</div>'
        +'<div style="width:100px;height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div style="width:'+pct+';height:100%;background:'+c+';border-radius:3px"></div></div>'
        +'<div style="width:28px;text-align:right;font-size:13px;font-weight:700;color:'+c+'">'+s.val+'</div>'
        +'</div>';
    }).join('')
    +'</div></div>'

    /* Matched NETS Solutions */
    +'<div class="drawer" style="margin-top:16px"><div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Matched NETS Solutions</div>'+sols+'</div>'

    /* Requirement Extraction Table */
    +(reqs.length?'<div class="drawer" style="margin-top:16px"><div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Tender Requirements</div>'
    +'<div class="tbl-wrap"><table><thead><tr><th>Requirement</th><th>Found in Tender</th><th>Our Capability</th><th>Gap</th></tr></thead><tbody>'
    +reqs.map(function(r){
      return'<tr><td style="font-weight:600">'+r.req+'</td><td style="text-align:center">'+(r.found?'<span style="color:var(--green)">\u2713 Yes</span>':'\u2014')+'</td><td style="text-align:center">'+(r.ours?'<span style="color:var(--green)">\u2713 Yes</span>':'<span style="color:var(--amber)">Partial</span>')+'</td><td style="color:var(--green);font-weight:600">'+r.gap+'</td></tr>';
    }).join('')
    +'</tbody></table></div></div>':'')

    /* RFP Qualification & Bidder Evaluation Gates */
    +renderQualGates(t)

    /* RFP Document */
    +(t.doc?'<div style="margin-top:16px"><a href="'+t.doc+'" target="_blank" style="display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:600;text-decoration:none">View RFP Document \u2197</a></div>':'<div style="margin-top:16px;padding:12px 16px;background:var(--amber-soft);border:1px solid var(--amber-border);border-radius:6px;font-size:12px;color:var(--amber)">No PDF available on portal. Contact procurement directly.</div>');
}

/* ===== BID BOARD (Qualified / Disqualified) ===== */
function vQualified(){
  function ensureVal(t){if(!t._sd)t._sd={estValue:Math.round((t.score/100)*800000+(t.solMatch.length*150000)),winProb:t.score>=95?65:t.score>=85?55:t.score>=75?45:35};return t._sd.estValue}
  var fmtV=function(n){if(n>=1e6)return"PKR "+(n/1e6).toFixed(1)+"M";if(n>=1e3)return"PKR "+(n/1e3).toFixed(0)+"K";return"PKR "+n};

  var discovered=T.filter(function(t){return t.score>=70&&t.open});
  var qualified=discovered.filter(function(t){return t.qualVerdict!=="NOGO"||t._forceOverride});
  var disqualified=discovered.filter(function(t){return t.qualVerdict==="NOGO"&&!t._forceOverride});

  var tab=window._qualTab||"qualified";

  /* Sort: urgency first (fewest days), then score */
  qualified.sort(function(a,b){return(a.days||999)-(b.days||999)||(b.score-a.score)});
  disqualified.sort(function(a,b){return b.score-a.score});

  var qualVal=0;qualified.forEach(function(t){qualVal+=ensureVal(t)});
  var dqVal=0;disqualified.forEach(function(t){dqVal+=ensureVal(t)});

  var html='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'
    +'<span style="font-size:12px;color:var(--green);cursor:pointer;font-weight:600" onclick="showView(\'overview\')">\u2190 Back to Overview</span></div>';

  /* \u2500\u2500 Summary strip \u2500\u2500 */
  html+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">';
  html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px">'
    +'<div style="font-size:10px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em">Discovered</div>'
    +'<div style="font-size:26px;font-weight:800;color:var(--fg)">'+discovered.length+'</div></div>';
  html+='<div style="background:var(--green-soft);border:1px solid var(--green-border);border-radius:8px;padding:14px 16px">'
    +'<div style="font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:.04em">Qualified (Biddable)</div>'
    +'<div style="font-size:26px;font-weight:800;color:var(--green)">'+qualified.length+'</div>'
    +'<div style="font-size:10px;color:var(--fg-faint)">'+fmtV(qualVal)+' pipeline</div></div>';
  html+='<div style="background:'+(disqualified.length?"var(--red-soft)":"var(--card)")+';border:1px solid '+(disqualified.length?"var(--red-border)":"var(--border)")+';border-radius:8px;padding:14px 16px">'
    +'<div style="font-size:10px;color:'+(disqualified.length?"var(--red)":"var(--fg-muted)")+';text-transform:uppercase;letter-spacing:.04em">Disqualified</div>'
    +'<div style="font-size:26px;font-weight:800;color:'+(disqualified.length?"var(--red)":"var(--fg-faint)")+'">'+disqualified.length+'</div>'
    +(disqualified.length?'<div style="font-size:10px;color:var(--fg-faint)">'+fmtV(dqVal)+' lost</div>':'')+'</div>';
  html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px">'
    +'<div style="font-size:10px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em">RFP Ready</div>'
    +'<div style="font-size:26px;font-weight:800;color:var(--green)">'+qualified.filter(function(t){return t.doc||t.acqStatus==="AUTO_DOWNLOADED"}).length+'</div>'
    +'<div style="font-size:10px;color:var(--fg-faint)">of '+qualified.length+' have documents</div></div>';
  html+='</div>';

  /* \u2500\u2500 RFP DOWNLOAD CONTROL PANEL \u2500\u2500 */
  var autoDownloaded=qualified.filter(function(t){return t.acqStatus==="AUTO_DOWNLOADED"});
  var manualNeeded=qualified.filter(function(t){return t.acqStatus==="MANUAL_DOWNLOAD_REQUIRED"});
  var pendingRfp=qualified.filter(function(t){return t.acqStatus==="PENDING"&&!t.doc});
  var hasDoc=qualified.filter(function(t){return t.doc||t.acqStatus==="AUTO_DOWNLOADED"});

  html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 20px;margin-bottom:16px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    +'<div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg)">RFP Document Acquisition</div>'
    +'<div style="display:flex;gap:6px">'
    +'<span style="font-size:11px;padding:3px 10px;border-radius:4px;background:var(--green-soft);color:var(--green);font-weight:600">\u2705 '+hasDoc.length+' ready</span>'
    +(manualNeeded.length?'<span style="font-size:11px;padding:3px 10px;border-radius:4px;background:var(--amber-soft);color:var(--amber);font-weight:600">\u26a0\ufe0f '+manualNeeded.length+' need you</span>':'')
    +(pendingRfp.length?'<span style="font-size:11px;padding:3px 10px;border-radius:4px;background:var(--bg);color:var(--fg-faint);font-weight:600">\u23f3 '+pendingRfp.length+' pending</span>':'')
    +'</div></div>';

  /* Auto-downloaded list (collapsed, show folder path) */
  if(autoDownloaded.length){
    html+='<div style="margin-bottom:10px">'
      +'<div style="font-size:11px;font-weight:600;color:var(--green);margin-bottom:4px">\u2705 Auto-Downloaded (Agent 1b) \u2014 Access at D:\\NETS\\DIGITISATION\\tender-fetcher\\</div>';
    autoDownloaded.slice(0,3).forEach(function(t){
      html+='<div style="font-size:11px;color:var(--fg-muted);padding:2px 0">'+t.id+': '+t.ti.substring(0,50)+'</div>';
    });
    if(autoDownloaded.length>3)html+='<div style="font-size:10px;color:var(--fg-faint)">+'+(autoDownloaded.length-3)+' more in D:\\ folder</div>';
    html+='</div>';
  }

  /* Manual download needed (prominent, with action links) */
  if(manualNeeded.length){
    html+='<div style="background:var(--amber-soft);border:1px solid var(--amber-border);border-radius:6px;padding:10px 14px;margin-bottom:10px">'
      +'<div style="font-size:11px;font-weight:700;color:var(--amber);margin-bottom:6px">\u26a0\ufe0f MANUAL DOWNLOAD REQUIRED ('+manualNeeded.length+' tenders)</div>'
      +'<div style="font-size:10px;color:var(--fg-muted);margin-bottom:6px">These RFPs require login or are behind a restricted portal. Open the link, download the PDF, and save it to the tender folder.</div>';
    manualNeeded.forEach(function(t){
      var link=t.detailUrl||"";
      html+='<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--amber-border)">'
        +'<span style="font-size:14px;font-weight:800;color:var(--amber);width:30px;text-align:center">'+t.score+'</span>'
        +'<div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:600;color:var(--fg)">'+t.ti.substring(0,50)+'</div>'
        +'<div style="font-size:10px;color:var(--fg-faint)">'+t.id+' \u00b7 '+(t.source||"PPRA")+(t.days!==null?" \u00b7 "+t.days+"d left":"")+'</div></div>'
        +(link?'<a href="'+link+'" target="_blank" onclick="event.stopPropagation()" style="background:var(--amber);color:#fff;padding:4px 10px;border-radius:4px;font-size:10px;font-weight:700;text-decoration:none;white-space:nowrap">Open Portal \u2197</a>':'<span style="font-size:10px;color:var(--fg-faint)">No link</span>')
        +'</div>';
    });
    html+='</div>';
  }

  /* Pending (not yet processed) */
  if(pendingRfp.length){
    html+='<div style="font-size:11px;color:var(--fg-faint);margin-bottom:6px">\u23f3 '+pendingRfp.length+' tenders awaiting Agent 1b processing (next run downloads automatically)</div>';
  }

  html+='</div>';

  /* \u2500\u2500 Tabs \u2500\u2500 */
  var tabQStyle=tab==="qualified"?"background:var(--green);color:#fff;border-color:var(--green)":"background:var(--card);color:var(--fg);border-color:var(--border)";
  var tabDStyle=tab==="disqualified"?"background:var(--red);color:#fff;border-color:var(--red)":"background:var(--card);color:var(--fg);border-color:var(--border)";
  html+='<div style="display:flex;gap:8px;margin-bottom:14px">'
    +'<button onclick="window._qualTab=\'qualified\';showView(\'qualified\')" style="font-size:12px;padding:7px 18px;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:700;border:1px solid;'+tabQStyle+'">Qualified ('+qualified.length+')</button>'
    +'<button onclick="window._qualTab=\'disqualified\';showView(\'qualified\')" style="font-size:12px;padding:7px 18px;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:700;border:1px solid;'+tabDStyle+'">Disqualified ('+disqualified.length+')</button>'
    +'</div>';

  var list=tab==="disqualified"?disqualified:qualified;

  if(tab==="qualified"){
    /* \u2500\u2500 QUALIFIED TABLE: what a Bid Director needs \u2500\u2500 */
    html+='<div class="sec-head">Biddable Tenders <span class="hint">'+qualified.length+' tenders, '+fmtV(qualVal)+' pipeline value</span></div>';
    html+='<div class="tbl-wrap"><table><thead><tr><th>Score</th><th>Tender</th><th>Portal</th><th>Solutions</th><th>Est. Value</th><th>Deadline</th><th>Gates</th><th>RFP</th></tr></thead><tbody>';
    list.forEach(function(t){
      var sols=t.solMatch.slice(0,2).map(function(s){return'<span class="badge b-g" style="font-size:8px;padding:1px 5px">'+s.name+'</span>'}).join(" ");
      var urgTag="";
      if(t.days!==null&&t.days<=3)urgTag='<span style="color:var(--red);font-weight:700;font-size:10px">'+t.days+'d!</span>';
      else if(t.days!==null&&t.days<=7)urgTag='<span style="color:var(--amber);font-size:10px">'+t.days+'d</span>';
      else if(t.days!==null)urgTag='<span style="color:var(--fg-faint);font-size:10px">'+t.days+'d</span>';

      /* Gate status summary */
      var gateCount=0;var gatePassed=0;
      var gg=t.qualGates||{};
      Object.keys(gg).forEach(function(k){gateCount++;if(gg[k].pass)gatePassed++});
      var gBadge=gateCount?'<span style="font-size:10px;color:'+(gatePassed===gateCount?"var(--green)":"var(--amber)")+'">'+gatePassed+'/'+gateCount+'</span>':'<span style="font-size:10px;color:var(--fg-faint)">5/5</span>';
      if(t._forceOverride)gBadge='<span style="font-size:9px;color:var(--amber);font-weight:700">OVERRIDE</span>';

      var rfpBadge=t.acqStatus==="AUTO_DOWNLOADED"?'<span class="badge b-g" style="font-size:8px">\u2713 DL</span>':t.acqStatus==="MANUAL_DOWNLOAD_REQUIRED"?'<span class="badge b-a" style="font-size:8px">Manual</span>':t.doc?'<a href="'+t.doc+'" target="_blank" style="color:var(--green);font-size:11px;text-decoration:none" onclick="event.stopPropagation()">PDF \u2197</a>':'<span style="color:var(--fg-faint)">\u2014</span>';

      html+='<tr onclick="FLT._detail=\''+t.id+'\';showView(\'detail\')" style="cursor:pointer">'
        +'<td><span style="font-size:16px;font-weight:800;color:'+(t.score>=85?"var(--green)":"var(--amber)")+'">'+t.score+'</span></td>'
        +'<td><strong style="font-size:11px">'+t.ti.substring(0,55)+(t.ti.length>55?"...":"")+'</strong><br><span style="font-size:9px;color:var(--fg-faint)">'+t.id+'</span></td>'
        +'<td><span class="badge '+(t.source==="PPRA"?"b-g":"b-a")+'" style="font-size:8px">'+(t.source||"SB")+'</span></td>'
        +'<td>'+sols+'</td>'
        +'<td style="font-size:11px;font-weight:600;color:var(--fg-muted)">'+fmtV(ensureVal(t))+'</td>'
        +'<td style="font-size:11px;white-space:nowrap">'+(t.cl||"")+' '+urgTag+'</td>'
        +'<td style="text-align:center">'+gBadge+'</td>'
        +'<td style="text-align:center">'+rfpBadge+'</td></tr>';
    });
    if(!list.length)html+='<tr><td colspan="8" style="text-align:center;color:var(--fg-faint);padding:20px">No qualified tenders. Next scan: tomorrow 05:47 UK.</td></tr>';
    html+='</tbody></table></div>';

  }else{
    /* \u2500\u2500 DISQUALIFIED TABLE: show reason + override button \u2500\u2500 */
    html+='<div class="sec-head">Disqualified Tenders <span class="hint">'+disqualified.length+' tenders failed qualification gates</span></div>';
    if(!list.length){
      html+='<div style="padding:20px;text-align:center;color:var(--fg-faint);font-size:13px">No disqualified tenders. All discovered tenders passed the qualification gates.</div>';
    }else{
      html+='<div class="tbl-wrap"><table><thead><tr><th>Score</th><th>Tender</th><th>Portal</th><th>Disqualification Reason</th><th>Est. Value</th><th>Action</th></tr></thead><tbody>';
      list.forEach(function(t){
        html+='<tr>'
          +'<td><span style="font-size:16px;font-weight:800;color:var(--red)">'+t.score+'</span></td>'
          +'<td><strong style="font-size:11px;cursor:pointer" onclick="FLT._detail=\''+t.id+'\';showView(\'detail\')">'+t.ti.substring(0,50)+(t.ti.length>50?"...":"")+'</strong><br><span style="font-size:9px;color:var(--fg-faint)">'+t.id+'</span></td>'
          +'<td><span class="badge '+(t.source==="PPRA"?"b-g":"b-a")+'" style="font-size:8px">'+(t.source||"SB")+'</span></td>'
          +'<td style="font-size:11px;color:var(--red)">'+(t.dqReason||"Failed qualification gates")+'</td>'
          +'<td style="font-size:11px;font-weight:600;color:var(--fg-muted)">'+fmtV(ensureVal(t))+'</td>'
          +'<td><button onclick="event.stopPropagation();forceOverrideTender(\''+t.id+'\');window._qualTab=\'qualified\';showView(\'qualified\')" style="background:var(--amber);color:#fff;border:none;padding:4px 10px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit">Override</button></td>'
          +'</tr>';
      });
      html+='</tbody></table></div>';
      html+='<div style="margin-top:10px;font-size:11px;color:var(--fg-faint)">Overriding a disqualified tender moves it to the Qualified tab and marks it as a Bid Director decision. The original gate failure is preserved in the tender detail view.</div>';
    }
  }

  return html;
}

function wbFmtV(n){n=Number(n)||0;if(n>=1e6)return"PKR "+(n/1e6).toFixed(1)+"M";if(n>=1e3)return"PKR "+(n/1e3).toFixed(0)+"K";return"PKR "+n}

/* ── PDF text extraction in the browser (pdf.js) ── */
async function wbExtractPdfText(file,maxPages){
  if(!window.pdfjsLib)throw new Error("pdf.js not loaded");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  var buf=await file.arrayBuffer();
  var pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  var out=[];var n=Math.min(pdf.numPages,maxPages||40);
  for(var i=1;i<=n;i++){
    var page=await pdf.getPage(i);var tc=await page.getTextContent();
    out.push("[Page "+i+"]\n"+tc.items.map(function(it){return it.str}).join(" "));
  }
  return{text:out.join("\n\n"),pages:pdf.numPages,extracted:n};
}

async function wbHandleUpload(id,input){
  var files=Array.from(input.files||[]);if(!files.length)return;
  var a=wbEnsure(id);a.uploading=true;showView("workbench");
  var allText="";var docs=[];
  for(var i=0;i<files.length;i++){
    var f=files[i];
    try{
      wbLog("Extracting text from "+f.name+" ...");
      var r=await wbExtractPdfText(f,40);
      allText+="\n\n===== FILE: "+f.name+" =====\n"+r.text;
      var assetId=null;
      if(ASSETS){try{var up=await ASSETS.upload(f);assetId=up.id;wbLog("Stored "+f.name+" ("+Math.round(up.sizeBytes/1024)+" KB)")}catch(e){wbLog("Asset store skipped for "+f.name+": "+(e.code||e.message))}}
      docs.push({name:f.name,size:f.size,pages:r.pages,extracted:r.extracted,asset_id:assetId});
    }catch(e){wbLog("Failed on "+f.name+": "+(e.message||e));docs.push({name:f.name,size:f.size,error:String(e.message||e)})}
  }
  allText=allText.slice(0,180000); /* keep well under the 256 KiB prompt cap */
  a.uploading=false;a.rfpText=allText;a.docs=(a.docs||[]).concat(docs);a.rfpSource="MANUAL_UPLOAD";
  await wbSave(id,{rfpText:allText,docs:a.docs,rfpSource:"MANUAL_UPLOAD",rfp_received_at:new Date().toISOString()});
  /* Mark the tender as acquired so Overview/Bid Board move it to the next stage */
  if(DB)DB.doc("tenders/"+id).update({acquisition_status:"MANUAL_UPLOADED",doc_accessible:true}).catch(function(){});
  wbLog("RFP text ready: "+allText.length.toLocaleString()+" characters from "+docs.length+" file(s)");
  showView("workbench");
}

/* ── Agent runners (each is a separate sample() call with its own instruction) ── */
function wbTenderCtx(t){
  return"TENDER\nID: "+t.id+"\nTitle: "+t.ti+"\nPortal: "+(t.source||"Sindh Bank")+"\nIssuer/Dept: "+(t.dept||"not stated")+"\nAdvertised: "+(t.ad||"?")+"\nClosing: "+(t.cl||"?")+(t.days!=null?" ("+t.days+" days left)":"")+"\nNETS keyword score: "+t.score+"\nMatched NETS domains: "+(t.solMatch||[]).map(function(s){return s.name}).join(", ");
}
function wbRfpSlice(a,n){var tx=(a&&a.rfpText)||"";return tx.length>n?tx.slice(0,n)+"\n\n[... RFP text truncated at "+n+" characters ...]":tx}

async function wbRunAgent(id,agent){
  var t=T.find(function(x){return x.id===id});var a=wbEnsure(id);
  if(!t)return;
  if(!SAMPLE){alert("Claude is not available in this view. Open the artifact in claude.ai and allow it to use Claude.");return}
  if(!a.rfpText&&agent!=="grading"){alert("Upload or pull the RFP document first. Agents 2, 4 and 5 need the RFP text.");return}
  WB.busy[agent]=true;showView("workbench");
  var ctl=new AbortController();WB.ctl=ctl;
  var out=document.getElementById("wb-out-"+agent);
  var onText=function(u){if(out)out.textContent=u.text};
  try{
    if(agent==="summary"){
      wbLog("Agent 2 (RFP Summary) started");
      var s=await SAMPLE.json(
"You are Agent 2, RFP Summariser for NETS International presales. Read the tender and RFP text and return ONLY a JSON object with these keys:\n"+
'{"issuer":string,"scope_summary":string (4 to 6 sentences, plain English),"deliverables":[string],"key_requirements":[string],"timeline":{"submission_deadline":string,"bid_validity":string,"delivery_period":string,"contract_duration":string},"eligibility":{"min_turnover":string,"years_experience":string,"oem_requirements":[string],"certifications":[string],"local_presence":string,"other":[string]},"commercials":{"estimated_value_pkr":number|null,"bid_security":string,"performance_guarantee":string,"payment_terms":string},"evaluation_method":string,"contacts":[string],"red_flags":[string]}\n'+
"Use null or an empty string when the RFP does not say. Do not invent figures. Numbers in PKR.\n\n"+wbTenderCtx(t)+"\n\nRFP TEXT:\n"+wbRfpSlice(a,120000),
        {signal:ctl.signal,onText:onText,modelTier:"default",cache:{gcTime:3600000}});
      a.summary=s;await wbSave(id,{summary:s});wbLog("Agent 2 done");
    }
    if(agent==="grading"){
      wbLog("Agent 3 (Bid/No-Bid Grader) started");
      var g=await SAMPLE.json(
"You are Agent 3, Bid/No-Bid Grader for NETS International. Grade this tender against NETS capabilities below. Be honest and specific: cite the RFP clause or requirement for every point. Return ONLY a JSON object:\n"+
'{"readiness_pct":number (0-100),"verdict":"BID"|"NO-BID"|"CONDITIONAL","confidence":"high"|"medium"|"low","value_estimate_pkr":number|null,"why_bid":[string],"why_not":[string],"gates":{"turnover":{"pass":boolean,"detail":string},"oem_tier":{"pass":boolean,"detail":string},"domain_fit":{"pass":boolean,"detail":string},"experience":{"pass":boolean,"detail":string},"resources":{"pass":boolean,"detail":string},"local_presence":{"pass":boolean,"detail":string}},"capability_coverage":[{"requirement":string,"nets_has":boolean,"how":string}],"risks":[{"risk":string,"severity":"high"|"medium"|"low","mitigation":string}],"win_themes":[string],"conditions_to_bid":[string],"recommended_oem":[string],"effort_estimate_days":number}\n'+
"readiness_pct = percentage of mandatory requirements NETS can evidence today. Return NO-BID if any hard limit is breached.\n\nNETS CAPABILITY BRIEF:\n"+NETS_BRIEF+"\n\n"+wbTenderCtx(t)+(a.summary?"\n\nAGENT 2 SUMMARY:\n"+JSON.stringify(a.summary).slice(0,8000):"")+"\n\nRFP TEXT:\n"+wbRfpSlice(a,100000),
        {signal:ctl.signal,onText:onText,modelTier:"default",cache:{gcTime:3600000}});
      a.grading=g;await wbSave(id,{grading:g});wbLog("Agent 3 done: "+g.verdict+" at "+g.readiness_pct+"%");
    }
    if(agent==="compliance"){
      wbLog("Agent 4 (Compliance Auditor) started");
      var c=await SAMPLE.json(
"You are Agent 4, Compliance Document Auditor for NETS International. From the RFP, list every document, form, certificate, declaration and attachment a bidder must submit. For each, say whether NETS can supply it from its standard bid pack (see brief) and what is missing. Return ONLY a JSON object:\n"+
'{"required_documents":[{"doc":string,"rfp_clause":string,"mandatory":boolean,"nets_status":"HAVE"|"NEED_TO_PREPARE"|"MISSING"|"NOT_APPLICABLE","owner":string,"note":string}],"missing_count":number,"have_count":number,"prepare_count":number,"submission_format":string,"envelope_structure":string,"bid_security":{"required":boolean,"amount":string,"form":string},"technical_forms":[string],"financial_forms":[string],"declarations":[string],"deadline_checklist":[{"item":string,"due":string}],"critical_gaps":[string]}\n'+
"Standard NETS bid pack already contains: company registration (SECP), NTN, GST/STRN, ISO 9001/14001/20000/27001/45001 certificates, SOC 2 report, audited financials (3 years), bank statement and solvency letter, OEM partner certificates (Cisco Gold, Dell Gold, Huawei Silver, Fortinet Advanced), 40+ client reference letters, PO copies, CVs of certified engineers (CCIE, CCNP, HCIP, NSE, PMP, CISSP), affidavit of non-blacklisting, power of attorney, integrity pact. Anything else is NEED_TO_PREPARE. Anything NETS cannot legitimately produce is MISSING.\n\n"+wbTenderCtx(t)+"\n\nRFP TEXT:\n"+wbRfpSlice(a,120000),
        {signal:ctl.signal,onText:onText,modelTier:"default",cache:{gcTime:3600000}});
      a.compliance=c;await wbSave(id,{compliance:c});wbLog("Agent 4 done: "+c.have_count+" have, "+c.prepare_count+" prepare, "+c.missing_count+" missing");
    }
    if(agent==="boq"){
      wbLog("Agent 5 (BOQ Drafter) started");
      var b=await SAMPLE.json(
"You are Agent 5, BOQ Drafter for NETS International presales. From the RFP scope, draft a Bill of Quantities a presales architect can refine. Map every line to a NETS partner OEM where possible. Prices are indicative list prices in PKR; mark confidence. Return ONLY a JSON object:\n"+
'{"currency":"PKR","assumptions":[string],"sections":[{"section":string,"lines":[{"sno":number,"item":string,"description":string,"oem":string,"part_no":string,"qty":number,"unit":string,"unit_price_pkr":number,"total_pkr":number,"confidence":"high"|"medium"|"low","rfp_ref":string}]}],"services":[{"item":string,"man_days":number,"rate_pkr":number,"total_pkr":number}],"subtotal_hardware_pkr":number,"subtotal_services_pkr":number,"contingency_pct":number,"grand_total_pkr":number,"exclusions":[string],"clarifications_needed":[string]}\n'+
"Prefer Cisco, Dell, Huawei, Fortinet, HPE, H3C, Sangfor, Kaspersky, Rapid7, IBM QRadar, BeyondTrust, Forcepoint. Include installation, configuration, testing, training, documentation and warranty/support lines as services. If quantities are not stated, estimate from scope and say so in assumptions.\n\n"+wbTenderCtx(t)+(a.summary?"\n\nAGENT 2 SUMMARY:\n"+JSON.stringify(a.summary).slice(0,8000):"")+"\n\nRFP TEXT:\n"+wbRfpSlice(a,110000),

    }
  }catch(e){
    var code=e&&e.code||"error";
    wbLog("Agent "+agent+" stopped: "+code+(e&&e.message?" ("+e.message+")":""));
    if(code==="not_granted")alert("You declined to let this page use Claude. Allow it from the artifact Permissions menu to run the agents.");
    else if(code==="invalid_json")alert("The agent returned text that was not valid JSON. Try again; if it repeats, upload a shorter or cleaner RFP.");
    else if(code==="rate_limited")alert("Claude usage limit reached for now. Try again in a few minutes.");
    else if(code!=="cancelled")alert("Agent failed: "+code+". "+(e&&e.message||""));
  }finally{
    WB.busy[agent]=false;showView("workbench");
  }
}

/* BOQ line editing */
function wbBoqEdit(id,si,li,field,val){
  var a=wbEnsure(id);if(!a.boq||!a.boq.sections||!a.boq.sections[si])return;

  if(field==="qty"||field==="unit_price_pkr")val=Number(val)||0;
  line[field]=val;line.total_pkr=(Number(line.qty)||0)*(Number(line.unit_price_pkr)||0);

function wbBoqDelLine(id,si,li){var a=wbEnsure(id);if(!a.boq)return;a.boq.sections[si].lines.splice(li,1);wbBoqRecalc(a.boq);wbSave(id,{boq:a.boq});showView("workbench")}
function wbBoqRecalc(b){
  var hw=0;(b.sections||[]).forEach(function(s){(s.lines||[]).forEach(function(l){hw+=Number(l.total_pkr)||0})});
  var sv=0;(b.services||[]).forEach(function(s){sv+=Number(s.total_pkr)||0});
  b.subtotal_hardware_pkr=hw;b.subtotal_services_pkr=sv;
  var cont=Number(b.contingency_pct)||0;b.grand_total_pkr=Math.round((hw+sv)*(1+cont/100));
}

function wbDownload(id,kind){
  var a=RFPA[id]||{};var t=T.find(function(x){return x.id===id})||{};var name=(id+"_"+kind).replace(/[^A-Za-z0-9_-]+/g,"_");

/* ═══ LIVE INTEGRITY TEST SUITE ═══
   Compares rendered metrics against raw state arrays (T, SCANS, PROPOSALS).
   Runs synchronously on every Settings page load. No mocks. */
function runLiveIntegrityTests(){
  var results=[];
  function a(pass,section,name,expected,got){results.push({pass:pass,section:section,name:name,expected:String(expected),got:String(got)})}

  /* ── A: State Model Integrity ── */
  var qual=T.filter(function(t){return t.score>=70});
  var qualOpen=qual.filter(function(t){return t.open});
  var closing7=qualOpen.filter(function(t){return t.days!==null&&t.days>=0&&t.days<=7});
  var rfpAvail=T.filter(function(t){return t.score>=70&&t.doc});

  a(T.length>=0,"State Model","T array is populated",">= 0",T.length);
  a(qual.length<=T.length,"State Model","Qualified <= Total tenders","<= "+T.length,qual.length);
  a(qualOpen.length<=qual.length,"State Model","Open qualified <= Qualified","<= "+qual.length,qualOpen.length);
  a(closing7.length<=qualOpen.length,"State Model","Closing 7d <= Open qualified","<= "+qualOpen.length,closing7.length);

  /* Every qualified tender has score >= 70 */
  var badScore=qual.filter(function(t){return t.score<70});
  a(badScore.length===0,"State Model","All qualified tenders have score >= 70","0 violations",badScore.length+" violations");

  /* Every open tender should have open===true */
  var openMismatch=qualOpen.filter(function(t){return !t.open});
  a(openMismatch.length===0,"State Model","Open flag consistent on open qualified set","0 mismatches",openMismatch.length+" mismatches");

  /* ── B: Date Parsing ── */
  var d1=parsePortalDate("5-Nov-26");
  var d2=parsePortalDate("22-Oct-2026");
  var d3=parsePortalDate("Invalid-Date");
  var d4=parsePortalDate("Dec 22, 2026");
  var d5=parsePortalDate("2026-11-25");

  a(d1 instanceof Date&&!isNaN(d1),"Date Parsing","Parses '5-Nov-26' (short year)","valid Date",d1?d1.toISOString().slice(0,10):"null");
  a(d2 instanceof Date&&!isNaN(d2),"Date Parsing","Parses '22-Oct-2026' (full year)","valid Date",d2?d2.toISOString().slice(0,10):"null");
  a(d3===null,"Date Parsing","Rejects 'Invalid-Date'","null",String(d3));
  a(d4 instanceof Date&&!isNaN(d4),"Date Parsing","Parses 'Dec 22, 2026' (PPRA format)","valid Date",d4?d4.toISOString().slice(0,10):"null");
  a(d5 instanceof Date&&!isNaN(d5),"Date Parsing","Parses '2026-11-25' (ISO format)","valid Date",d5?d5.toISOString().slice(0,10):"null");

  /* ── C: Sales Dashboard Calculations ── */
  var bids=qualOpen;
  var rawPipeline=0;
  var rawForecast=0;
  bids.forEach(function(t){
    if(!t._sd)t._sd={estValue:Math.round((t.score/100)*800000+(t.solMatch.length*150000)),winProb:t.score>=95?65:t.score>=85?55:t.score>=75?45:35};
    rawPipeline+=t._sd.estValue;
    rawForecast+=Math.round(t._sd.estValue*(t._sd.winProb/100));
  });

  a(rawPipeline>=0,"Sales Calculations","Pipeline value is non-negative",">= 0",rawPipeline);
  a(rawForecast<=rawPipeline,"Sales Calculations","Weighted forecast <= pipeline value","<= "+rawPipeline,rawForecast);
  a(bids.length===qualOpen.length,"Sales Calculations","Active bids count matches open qualified",qualOpen.length,bids.length);

  /* Win probability bounds */
  var badProb=bids.filter(function(t){return t._sd&&(t._sd.winProb<0||t._sd.winProb>100)});
  a(badProb.length===0,"Sales Calculations","All win probabilities in 0..100 range","0 violations",badProb.length+" violations");

  /* ── D: Export Functions ── */
  a(typeof exportSalesCSV==="function","Export Integrity","exportSalesCSV is defined","function",typeof exportSalesCSV);
  a(typeof exportSalesJSON==="function","Export Integrity","exportSalesJSON is defined","function",typeof exportSalesJSON);

  /* ── E: Database Connection ── */
  a(typeof DB!=="undefined","Database","DB variable is defined","defined",typeof DB);
  a(Array.isArray(T),"Database","T is an array","true",Array.isArray(T));
  a(Array.isArray(SCANS),"Database","SCANS is an array","true",Array.isArray(SCANS));
  a(Array.isArray(PROPOSALS),"Database","PROPOSALS is an array","true",Array.isArray(PROPOSALS));

  /* ── F: Tender Data Quality ── */
  var noId=T.filter(function(t){return !t.id});
  a(noId.length===0,"Data Quality","All tenders have an ID","0 missing",noId.length+" missing");

  var noTitle=T.filter(function(t){return !t.ti||t.ti.length<3});
  a(noTitle.length===0,"Data Quality","All tenders have a meaningful title (3+ chars)","0 missing",noTitle.length+" missing");

  var noScore=T.filter(function(t){return t.score===undefined||t.score===null});
  a(noScore.length===0,"Data Quality","All tenders have a score","0 missing",noScore.length+" missing");

  /* Source portal check */
  var validSources=T.filter(function(t){return t.source==="PPRA"||t.source==="Sindh Bank"||!t.source});
  a(validSources.length===T.length,"Data Quality","All sources are PPRA or Sindh Bank",T.length+" valid",validSources.length+" valid");

  /* ── G: Scan Log Integrity ── */
  if(SCANS.length>0){
    var s0=SCANS[0];
    a(s0.date&&s0.date.length>0,"Scan Logs","Latest scan has a date","non-empty",s0.date||"empty");
    a(typeof s0.total_on_portal==="number","Scan Logs","total_on_portal is a number","number",typeof s0.total_on_portal);
    a(typeof s0.qualified_count==="number","Scan Logs","qualified_count is a number","number",typeof s0.qualified_count);
    a(s0.qualified_count<=s0.total_on_portal,"Scan Logs","Qualified <= Total on portal","<= "+s0.total_on_portal,s0.qualified_count);
  }else{
    a(true,"Scan Logs","No scans yet (expected for fresh install)","0 scans","0 scans");
  }

  return results;
}
